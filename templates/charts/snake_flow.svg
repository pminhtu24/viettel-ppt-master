        <rect x="353" y="618" width="240" height="5" fill="#F46A25"/>
        <text x="473" y="646" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="473" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>
    <g id="card-09">
        <rect x="627" y="618" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="627" y="618" width="240" height="5" fill="#EE0033"/>
        <text x="747" y="646" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="747" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>
    <g id="card-10" data-viettel-blue-scope="chart">
        <rect x="900" y="618" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="900" y="618" width="240" height="5" fill="#7C3AED"/>
        <text x="1020" y="646" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="1020" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>

    <!-- ==================== Nodes (heavy dual-ring: halo r=46 + white separator r=38 + solid disc r=32) ==================== -->
    <g id="node-01" data-viettel-blue-scope="chart">
        <circle cx="200" cy="200" r="46" fill="#12436D" fill-opacity="0.15"/>
        <circle cx="200" cy="200" r="38" fill="#FFFFFF" filter="url(#nodeShadow)"/>
        <circle cx="200" cy="200" r="32" fill="#12436D"/>
        <text x="200" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan>01</tspan></text>
    </g>
    <g id="node-02" data-viettel-blue-scope="chart">
        <circle cx="473" cy="200" r="46" fill="#7C3AED" fill-opacity="0.15"/>
        <circle cx="473" cy="200" r="38" fill="#FFFFFF" filter="url(#nodeShadow)"/>
        <circle cx="473" cy="200" r="32" fill="#7C3AED"/>
        <text x="473" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF"><tspan>02</tspan></text>
    </g>
    <g id="node-03" data-viettel-blue-scope="chart">
