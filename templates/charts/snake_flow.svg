<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Snake Flow Diagram Template
    Purpose: Long sequential journey winding across multiple rows
    Use cases: Multi-year roadmap, lifecycle, multi-stage workflow, 6-10 milestone timeline
    Design Principles:
      - Three-row serpentine (4-2-4 node distribution); two-row variant works for 6-8
      - Each node carries its own Tailwind hue (CHART_STYLE_GUIDE §1.2 spectrum)
      - Visual weight comes from: thick ribbon path (24px), large dual-ring nodes (r=32 solid), filled cards with top color band, strong shadows
      - NO mid-path chevron arrows (row direction reads as flow)
    -->
    <defs>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feFlood flood-color="#0F172A" flood-opacity="0.12" result="shadowColor"/>
            <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
            <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feFlood flood-color="#0F172A" flood-opacity="0.15" result="shadowColor"/>
            <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
            <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <!-- ==================== Header ==================== -->
    <text x="640" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="#000000"><tspan>Ten-Year Strategic Roadmap</tspan></text>
    <text x="640" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#44494D" letter-spacing="1.5"><tspan>DECADE JOURNEY · TEN MILESTONES · THREE-ROW SERPENTINE</tspan></text>

    <!-- ==================== Continuous Ribbon Path (3-row S, 4-2-4 layout) ==================== -->
    <!-- Top row y=200 (x=200..1020), right U-turn r=100, mid row y=400 (R->L), left U-turn r=90, bottom row y=580 -->
    <!-- Heavy ribbon base + thin inner rail for "tracked" feel -->
    <path d="M 200 200 H 1020 A 100 100 0 0 1 1020 400 H 200 A 90 90 0 0 0 200 580 H 1020"
          fill="none" stroke="#F2F2F2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 200 200 H 1020 A 100 100 0 0 1 1020 400 H 200 A 90 90 0 0 0 200 580 H 1020"
          fill="none" stroke="#12436D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.35" data-viettel-blue-scope="chart"/>

    <!-- ==================== Cards (filled tint + top color band + shadow) ==================== -->
    <!-- Top row cards: ABOVE the row (between title and nodes) -->
    <g id="card-01" data-viettel-blue-scope="chart">
        <rect x="80" y="110" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="80" y="110" width="240" height="5" fill="#12436D"/>
        <text x="200" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="200" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>
    <g id="card-02" data-viettel-blue-scope="chart">
        <rect x="353" y="110" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="353" y="110" width="240" height="5" fill="#7C3AED"/>
        <text x="473" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="473" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>
    <g id="card-03" data-viettel-blue-scope="chart">
        <rect x="627" y="110" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="627" y="110" width="240" height="5" fill="#12436D"/>
        <text x="747" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="747" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>
    <g id="card-04" data-viettel-blue-scope="chart">
        <rect x="900" y="110" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="900" y="110" width="240" height="5" fill="#12436D"/>
        <text x="1020" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="1020" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>

    <!-- Mid row cards: BELOW the nodes -->
    <g id="card-05" data-viettel-blue-scope="chart">
        <rect x="627" y="438" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="627" y="438" width="240" height="5" fill="#12436D"/>
        <text x="747" y="466" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="747" y="488" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>
    <g id="card-06" data-viettel-blue-scope="chart">
        <rect x="353" y="438" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="353" y="438" width="240" height="5" fill="#10B981"/>
        <text x="473" y="466" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="473" y="488" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
    </g>

    <!-- Bottom row cards: BELOW the nodes -->
    <g id="card-07">
        <rect x="80" y="618" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <rect x="80" y="618" width="240" height="5" fill="#F46A25"/>
        <text x="200" y="646" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#000000"><tspan>Milestone Title</tspan></text>
        <text x="200" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#44494D"><tspan>Concise description of scope.</tspan></text>
