<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Horizontal Bar Chart Template
    Usage: Category ranking, value comparison (ideal for long category names)
    Scenarios: Sales leaderboards, brand awareness, satisfaction scores
    Supports: 8 bars (adjustable to 5-12)
    -->
    <!-- Background -->
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- Title -->
    <g id="header">
        <text x="60" y="70"
              font-size="32" font-weight="700" fill="#000000">Brand Awareness Rankings</text>
        <text x="60" y="105"
              font-size="18" fill="#44494D">2025 Consumer Survey Report · Sample Size N=5,000</text>
    </g>
    <!-- Chart Area -->
    <g id="horizontal_bar_chart" data-viettel-blue-scope="chart">
    <g id="chartArea">
        <!-- X-Axis Grid Lines -->
        <line x1="300" y1="140" x2="300" y2="620" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="480" y1="140" x2="480" y2="620" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="660" y1="140" x2="660" y2="620" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="840" y1="140" x2="840" y2="620" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="1020" y1="140" x2="1020" y2="620" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="1200" y1="140" x2="1200" y2="620" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="4,4"/>
        <!-- X-Axis Tick Labels -->
        <text x="300" y="650"
              font-size="14" fill="#44494D" text-anchor="middle">0%</text>
        <text x="480" y="650"
              font-size="14" fill="#44494D" text-anchor="middle">20%</text>
        <text x="660" y="650"
              font-size="14" fill="#44494D" text-anchor="middle">40%</text>
        <text x="840" y="650"
              font-size="14" fill="#44494D" text-anchor="middle">60%</text>
        <text x="1020" y="650"
              font-size="14" fill="#44494D" text-anchor="middle">80%</text>
        <text x="1200" y="650"
              font-size="14" fill="#44494D" text-anchor="middle">100%</text>
        <!-- Y-Axis Baseline -->
        <line x1="300" y1="140" x2="300" y2="620" stroke="#999999" stroke-width="2"/>
        <line x1="300" y1="620" x2="1200" y2="620" stroke="#999999" stroke-width="2"/>
        <!-- chart-plot-area: 300,140,1200,620 -->
        <!-- Bar Data (Height 36px, Spacing 24px, Total 60px) -->
        <!-- Bar 1: Brand A - 92% (Rank 1, Blue) -->
        <text x="290" y="178"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand A (Market Leader)</text>
        <rect x="300" y="155" width="828" height="36" rx="4" fill="#12436D"/>
        <text x="1138" y="179"
              font-size="16" font-weight="700" fill="#000000">92%</text>
        <!-- Bar 2: Brand B - 78% (Rank 2, Blue) -->
        <text x="290" y="238"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand B (Emerging Challenger)</text>
        <rect x="300" y="215" width="702" height="36" rx="4" fill="#12436D"/>
        <text x="1012" y="239"
              font-size="16" font-weight="700" fill="#000000">78%</text>
        <!-- Bar 3: Brand C - 65% (Rank 3, Blue) -->
        <text x="290" y="298"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand C (Legacy Brand)</text>
        <rect x="300" y="275" width="585" height="36" rx="4" fill="#12436D"/>
        <text x="895" y="299"
              font-size="16" font-weight="700" fill="#000000">65%</text>
        <!-- Bar 4: Brand D - 52% (Rank 4, Green) -->
        <text x="290" y="358"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand D (Regional Player)</text>
        <rect x="300" y="335" width="468" height="36" rx="4" fill="#059669"/>
        <text x="778" y="359"
              font-size="16" font-weight="700" fill="#000000">52%</text>
        <!-- Bar 5: Brand E - 45% (Rank 5, Green) -->
        <text x="290" y="418"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand E (Value Choice)</text>
        <rect x="300" y="395" width="405" height="36" rx="4" fill="#059669"/>
        <text x="715" y="419"
              font-size="16" font-weight="700" fill="#000000">45%</text>
        <!-- Bar 6: Brand F - 38% (Rank 6, Green) -->
        <text x="290" y="478"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand F (Premium Tier)</text>
        <rect x="300" y="455" width="342" height="36" rx="4" fill="#059669"/>
        <text x="652" y="479"
              font-size="16" font-weight="700" fill="#000000">38%</text>
        <!-- Bar 7: Brand G - 25% (Rank 7, Amber) -->
        <text x="290" y="538"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Brand G (New Entrant)</text>
        <rect x="300" y="515" width="225" height="36" rx="4" fill="#F46A25"/>
        <text x="535" y="539"
              font-size="16" font-weight="700" fill="#000000">25%</text>
        <!-- Bar 8: Other - 12% (Rank 8, Amber) -->
        <text x="290" y="598"
              font-size="15" font-weight="500" fill="#44494D" text-anchor="end">Other Brands</text>
        <rect x="300" y="575" width="108" height="36" rx="4" fill="#F46A25"/>
        <text x="418" y="599"
              font-size="16" font-weight="700" fill="#000000">12%</text>
    </g>
    </g>
    <!-- Legend -->
    <g id="legend" data-viettel-blue-scope="chart">
        <rect x="60" y="660" width="16" height="16" rx="2" fill="#12436D"/>
        <text x="85" y="673"
              font-size="14" fill="#44494D">High Awareness (≥50%)</text>
        <rect x="270" y="660" width="16" height="16" rx="2" fill="#059669"/>
        <text x="295" y="673"
              font-size="14" fill="#44494D">Moderate Awareness (30-50%)</text>
        <rect x="520" y="660" width="16" height="16" rx="2" fill="#F46A25"/>
        <text x="545" y="673"
              font-size="14" fill="#44494D">Low Awareness (&lt;30%)</text>
    </g>
    <!-- Data Source -->
    <g id="source">
        <text x="1220" y="695"
              font-size="14" fill="#999999" text-anchor="end">Source: Market Research Department</text>
    </g>
</svg>
