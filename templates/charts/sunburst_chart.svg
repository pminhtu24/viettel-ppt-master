<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Sunburst Chart Template
    Purpose: Hierarchical part-to-whole composition across 2-3 levels
    Use cases: portfolio mix, budget tree, customer segment hierarchy
    Feature: Ring hierarchy, leaf legend, compact interpretation panel
    -->

    <rect width="1280" height="720" fill="#FFFFFF"/>
    <g id="header">
        <text x="60" y="70"
              font-size="34" font-weight="800" fill="#000000"><tspan>Revenue Mix by Segment</tspan></text>
        <text x="60" y="100"
              font-size="14" font-weight="700" fill="#44494D" letter-spacing="1"><tspan>2025 PORTFOLIO REVENUE · HIERARCHICAL SHARE VIEW</tspan></text>
    </g>
    <g id="sunburst_chart" data-viettel-blue-scope="chart">
        <!-- chart-plot-area: sunburst | center: 500,380 | outer-radius: 240 | inner-radius: 72 -->
        <g id="chartArea">
            <circle cx="500" cy="380" r="276" fill="#FFFFFF"/>
            <circle cx="500" cy="380" r="72" fill="#000000"/>
            <text x="500" y="374"
                  font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>Total</tspan></text>
            <text x="500" y="400"
                  font-size="15" font-weight="700" fill="#E6E6E6" text-anchor="middle"><tspan>100%</tspan></text>
            <!-- Parent ring -->
            <circle cx="500" cy="380" r="146" fill="none" stroke="#12436D" stroke-width="82"
                    stroke-dasharray="504 917" stroke-dashoffset="0" transform="rotate(-90 500 380)"/>
            <circle cx="500" cy="380" r="146" fill="none" stroke="#10B981" stroke-width="82"
                    stroke-dasharray="339 917" stroke-dashoffset="-520" transform="rotate(-90 500 380)"/>
            <circle cx="500" cy="380" r="146" fill="none" stroke="#F46A25" stroke-width="82"
                    stroke-dasharray="73 917" stroke-dashoffset="-875" transform="rotate(-90 500 380)"/>
            <!-- Leaf ring -->
            <circle cx="500" cy="380" r="238" fill="none" stroke="#12436D" stroke-width="72"
                    stroke-dasharray="523 1495" stroke-dashoffset="0" transform="rotate(-90 500 380)"/>
            <circle cx="500" cy="380" r="238" fill="none" stroke="#12436D" stroke-width="72"
                    stroke-dasharray="299 1495" stroke-dashoffset="-540" transform="rotate(-90 500 380)"/>
            <circle cx="500" cy="380" r="238" fill="none" stroke="#10B981" stroke-width="72"
                    stroke-dasharray="374 1495" stroke-dashoffset="-855" transform="rotate(-90 500 380)"/>
            <circle cx="500" cy="380" r="238" fill="none" stroke="#10B981" stroke-width="72"
                    stroke-dasharray="179 1495" stroke-dashoffset="-1245" transform="rotate(-90 500 380)"/>
            <circle cx="500" cy="380" r="238" fill="none" stroke="#F46A25" stroke-width="72"
                    stroke-dasharray="120 1495" stroke-dashoffset="-1440" transform="rotate(-90 500 380)"/>
            <!-- White separators preserve the sunburst reading in fallback mode. -->
            <circle cx="500" cy="380" r="104" fill="none" stroke="#FFFFFF" stroke-width="4"/>
            <circle cx="500" cy="380" r="188" fill="none" stroke="#FFFFFF" stroke-width="4"/>
            <circle cx="500" cy="380" r="276" fill="none" stroke="#FFFFFF" stroke-width="4"/>
            <line x1="500" y1="104" x2="500" y2="184" stroke="#FFFFFF" stroke-width="4"/>
            <line x1="654" y1="151" x2="610" y2="218" stroke="#FFFFFF" stroke-width="4"/>
            <line x1="740" y1="519" x2="670" y2="480" stroke="#FFFFFF" stroke-width="4"/>
            <line x1="325" y1="594" x2="375" y2="532" stroke="#FFFFFF" stroke-width="4"/>
            <line x1="270" y1="228" x2="340" y2="268" stroke="#FFFFFF" stroke-width="4"/>
            <text x="500" y="145"
                  font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>NA</tspan></text>
            <text x="668" y="430"
                  font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>EU</tspan></text>
            <text x="350" y="290"
                  font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>APAC</tspan></text>
        </g>
    </g>
    <g id="legend" transform="translate(820, 150)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="390" height="430" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="28" y="42"
              font-size="18" font-weight="800" fill="#000000"><tspan>Leaf Segments</tspan></text>
        <text x="28" y="66" font-size="13" font-weight="600" fill="#44494D">Outer ring = second-level parts<tspan x="28" dy="17">of each inner segment.</tspan></text>
        <rect x="28" y="105" width="16" height="16" rx="4" fill="#12436D"/>
        <text x="58" y="119" font-size="15" font-weight="700" fill="#44494D"><tspan>North America - Enterprise</tspan></text>
        <text x="340" y="119" font-size="15" font-weight="800" fill="#000000" text-anchor="end"><tspan>35</tspan></text>
        <rect x="28" y="153" width="16" height="16" rx="4" fill="#12436D"/>
        <text x="58" y="167" font-size="15" font-weight="700" fill="#44494D"><tspan>North America - SMB</tspan></text>
        <text x="340" y="167" font-size="15" font-weight="800" fill="#000000" text-anchor="end"><tspan>20</tspan></text>
        <rect x="28" y="201" width="16" height="16" rx="4" fill="#10B981"/>
        <text x="58" y="215" font-size="15" font-weight="700" fill="#44494D"><tspan>Europe - Enterprise</tspan></text>
        <text x="340" y="215" font-size="15" font-weight="800" fill="#000000" text-anchor="end"><tspan>25</tspan></text>
        <rect x="28" y="249" width="16" height="16" rx="4" fill="#10B981"/>
        <text x="58" y="263" font-size="15" font-weight="700" fill="#44494D"><tspan>Europe - SMB</tspan></text>
        <text x="340" y="263" font-size="15" font-weight="800" fill="#000000" text-anchor="end"><tspan>12</tspan></text>
        <rect x="28" y="297" width="16" height="16" rx="4" fill="#F46A25"/>
        <text x="58" y="311" font-size="15" font-weight="700" fill="#44494D"><tspan>Asia Pacific - Digital</tspan></text>
        <text x="340" y="311" font-size="15" font-weight="800" fill="#000000" text-anchor="end"><tspan>8</tspan></text>
        <rect x="28" y="355" width="330" height="46" rx="8" fill="#F2F2F2" stroke="#12436D" stroke-opacity="0.25"/>
        <text x="48" y="384"
              font-size="14" font-weight="800" fill="#000000"><tspan>North America contributes 55% of total.</tspan></text>
    </g>
    <g id="source">
        <text x="60" y="690"
              font-size="14" font-weight="600" fill="#999999"><tspan>Data Source: Revenue Operations</tspan></text>
    </g>
</svg>
