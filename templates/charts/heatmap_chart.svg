<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     font-size="12">
    <!--
    Heatmap Chart Template
    Usage: Matrix data visualization, correlation analysis
    Scenarios: Activity heatmaps, time-series analysis, user behavior
    Supports: 7×7 or 7x8 matrix grid
    -->
    <defs>
        <!-- Heatmap Gradient Scale (Blue to Red) -->
        <linearGradient id="heatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#28A197;stop-opacity:0.08"/>
            <stop offset="25%" style="stop-color:#28A197;stop-opacity:0.3"/>
            <stop offset="50%" style="stop-color:#28A197;stop-opacity:0.5"/>
            <stop offset="75%" style="stop-color:#28A197;stop-opacity:0.7"/>
            <stop offset="100%" style="stop-color:#28A197;stop-opacity:0.9"/>
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- Title -->
    <g id="header">
        <text x="60" y="55"
              font-size="32" font-weight="700" fill="#000000">User Activity Heatmap Analysis</text>
        <text x="60" y="90"
              font-size="18" fill="#44494D">Active Users by Day and Time · Values in Thousands (K)</text>
    </g>
    <!-- Heatmap Area -->
    <g id="heatmapArea" transform="translate(180, 135)">
        <!-- Column Titles (Days) -->
        <text x="40" y="-15"
              font-size="14" font-weight="600" fill="#44494D" text-anchor="middle">Mon</text>
        <text x="120" y="-15"
              font-size="14" font-weight="600" fill="#44494D" text-anchor="middle">Tue</text>
        <text x="200" y="-15"
              font-size="14" font-weight="600" fill="#44494D" text-anchor="middle">Wed</text>
        <text x="280" y="-15"
              font-size="14" font-weight="600" fill="#44494D" text-anchor="middle">Thu</text>
        <text x="360" y="-15"
              font-size="14" font-weight="600" fill="#44494D" text-anchor="middle">Fri</text>
        <text x="440" y="-15"
              font-size="14" font-weight="600" fill="#EE0033" text-anchor="middle">Sat</text>
        <text x="520" y="-15"
              font-size="14" font-weight="600" fill="#EE0033" text-anchor="middle">Sun</text>
        <!-- Row Titles (Time) -->
        <text x="-15" y="35"
              font-size="13" fill="#44494D" text-anchor="end">06:00 - 09:00</text>
        <text x="-15" y="95"
              font-size="13" fill="#44494D" text-anchor="end">09:00 - 12:00</text>
        <text x="-15" y="155"
              font-size="13" fill="#44494D" text-anchor="end">12:00 - 14:00</text>
        <text x="-15" y="215"
              font-size="13" fill="#44494D" text-anchor="end">14:00 - 17:00</text>
        <text x="-15" y="275"
              font-size="13" fill="#44494D" text-anchor="end">17:00 - 19:00</text>
        <text x="-15" y="335"
              font-size="13" fill="#44494D" text-anchor="end">19:00 - 21:00</text>
        <text x="-15" y="395"
              font-size="13" fill="#44494D" text-anchor="end">21:00 - 23:00</text>
        <text x="-15" y="455"
              font-size="13" fill="#44494D" text-anchor="end">23:00 - 06:00</text>
        <!-- Heatmap Cells -->
        <!-- Row 1 -->
        <rect x="0" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.37"/><text x="40" y="40" font-size="13" fill="#000000" text-anchor="middle">35</text>
        <rect x="80" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.43"/><text x="120" y="40" font-size="13" fill="#000000" text-anchor="middle">42</text>
        <rect x="160" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.41"/><text x="200" y="40" font-size="13" fill="#000000" text-anchor="middle">40</text>
        <rect x="240" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.4"/><text x="280" y="40" font-size="13" fill="#000000" text-anchor="middle">38</text>
        <rect x="320" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.31"/><text x="360" y="40" font-size="13" fill="#000000" text-anchor="middle">28</text>
        <rect x="400" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.21"/><text x="440" y="40" font-size="13" fill="#000000" text-anchor="middle">15</text>
        <rect x="480" y="5" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.16"/><text x="520" y="40" font-size="13" fill="#000000" text-anchor="middle">10</text>
        <!-- Row 2 -->
        <rect x="0" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.57"/><text x="40" y="100" font-size="13" fill="#000000" text-anchor="middle">58</text>
        <rect x="80" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.62"/><text x="120" y="100" font-size="13" fill="#000000" text-anchor="middle">65</text>
        <rect x="160" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.68"/><text x="200" y="100" font-size="13" fill="#000000" text-anchor="middle">72</text>
        <rect x="240" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.65"/><text x="280" y="100" font-size="13" fill="#000000" text-anchor="middle">68</text>
        <rect x="320" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.54"/><text x="360" y="100" font-size="13" fill="#000000" text-anchor="middle">55</text>
        <rect x="400" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.46"/><text x="440" y="100" font-size="13" fill="#000000" text-anchor="middle">45</text>
        <rect x="480" y="65" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.4"/><text x="520" y="100" font-size="13" fill="#000000" text-anchor="middle">38</text>
        <!-- Row 3 -->
        <rect x="0" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.71"/><text x="40" y="160" font-size="13" fill="#000000" text-anchor="middle">75</text>
        <rect x="80" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.77"/><text x="120" y="160" font-size="13" fill="#000000" text-anchor="middle">82</text>
        <rect x="160" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.82"/><text x="200" y="160" font-size="13" fill="#000000" text-anchor="middle">88</text>
        <rect x="240" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.75"/><text x="280" y="160" font-size="13" fill="#000000" text-anchor="middle">80</text>
        <rect x="320" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.67"/><text x="360" y="160" font-size="13" fill="#000000" text-anchor="middle">70</text>
        <rect x="400" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.58"/><text x="440" y="160" font-size="13" fill="#000000" text-anchor="middle">60</text>
        <rect x="480" y="125" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.62"/><text x="520" y="160" font-size="13" fill="#000000" text-anchor="middle">65</text>
        <!-- Row 4 -->
        <rect x="0" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.54"/><text x="40" y="220" font-size="13" fill="#000000" text-anchor="middle">55</text>
        <rect x="80" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.6"/><text x="120" y="220" font-size="13" fill="#000000" text-anchor="middle">62</text>
        <rect x="160" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.65"/><text x="200" y="220" font-size="13" fill="#000000" text-anchor="middle">68</text>
        <rect x="240" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.58"/><text x="280" y="220" font-size="13" fill="#000000" text-anchor="middle">60</text>
        <rect x="320" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.48"/><text x="360" y="220" font-size="13" fill="#000000" text-anchor="middle">48</text>
        <rect x="400" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.68"/><text x="440" y="220" font-size="13" fill="#000000" text-anchor="middle">72</text>
        <rect x="480" y="185" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.73"/><text x="520" y="220" font-size="13" fill="#000000" text-anchor="middle">78</text>
        <!-- Row 5 -->
        <rect x="0" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.35"/><text x="40" y="280" font-size="13" fill="#000000" text-anchor="middle">32</text>
        <rect x="80" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.37"/><text x="120" y="280" font-size="13" fill="#000000" text-anchor="middle">35</text>
        <rect x="160" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.4"/><text x="200" y="280" font-size="13" fill="#000000" text-anchor="middle">38</text>
        <rect x="240" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.37"/><text x="280" y="280" font-size="13" fill="#000000" text-anchor="middle">35</text>
        <rect x="320" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.31"/><text x="360" y="280" font-size="13" fill="#000000" text-anchor="middle">28</text>
        <rect x="400" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.62"/><text x="440" y="280" font-size="13" fill="#000000" text-anchor="middle">65</text>
        <rect x="480" y="245" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.67"/><text x="520" y="280" font-size="13" fill="#000000" text-anchor="middle">70</text>
        <!-- Row 6 (Peak) -->
        <rect x="0" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.73"/><text x="40" y="340" font-size="13" fill="#000000" text-anchor="middle">78</text>
        <rect x="80" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.79"/><text x="120" y="340" font-size="13" fill="#000000" text-anchor="middle">85</text>
        <rect x="160" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.82"/><text x="200" y="340" font-size="13" fill="#000000" text-anchor="middle">88</text>
        <rect x="240" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.8"/><text x="280" y="340" font-size="13" fill="#000000" text-anchor="middle">86</text>
        <rect x="320" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.75"/><text x="360" y="340" font-size="13" fill="#000000" text-anchor="middle">80</text>
        <rect x="400" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.87"/><text x="440" y="340" font-size="13" fill="#000000" text-anchor="middle">95</text>
        <rect x="480" y="305" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.9"/><text x="520" y="340" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">98</text>
        <!-- Row 7 -->
        <rect x="0" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.6"/><text x="40" y="400" font-size="13" fill="#000000" text-anchor="middle">62</text>
        <rect x="80" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.67"/><text x="120" y="400" font-size="13" fill="#000000" text-anchor="middle">70</text>
        <rect x="160" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.68"/><text x="200" y="400" font-size="13" fill="#000000" text-anchor="middle">72</text>
        <rect x="240" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.65"/><text x="280" y="400" font-size="13" fill="#000000" text-anchor="middle">68</text>
        <rect x="320" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.62"/><text x="360" y="400" font-size="13" fill="#000000" text-anchor="middle">65</text>
        <rect x="400" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.79"/><text x="440" y="400" font-size="13" fill="#000000" text-anchor="middle">85</text>
        <rect x="480" y="365" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.77"/><text x="520" y="400" font-size="13" fill="#000000" text-anchor="middle">82</text>
        <!-- Row 8 -->
        <rect x="0" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.23"/><text x="40" y="460" font-size="13" fill="#000000" text-anchor="middle">18</text>
        <rect x="80" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.21"/><text x="120" y="460" font-size="13" fill="#000000" text-anchor="middle">15</text>
        <rect x="160" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.18"/><text x="200" y="460" font-size="13" fill="#000000" text-anchor="middle">12</text>
        <rect x="240" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.21"/><text x="280" y="460" font-size="13" fill="#000000" text-anchor="middle">15</text>
        <rect x="320" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.26"/><text x="360" y="460" font-size="13" fill="#000000" text-anchor="middle">22</text>
        <rect x="400" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.37"/><text x="440" y="460" font-size="13" fill="#000000" text-anchor="middle">35</text>
        <rect x="480" y="425" width="78" height="58" rx="4" fill="#28A197" fill-opacity="0.31"/><text x="520" y="460" font-size="13" fill="#000000" text-anchor="middle">28</text>
