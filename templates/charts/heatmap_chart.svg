    <!-- Color Legend -->
    <g id="colorLegend" transform="translate(800, 135)">
        <text x="0" y="0"
              font-size="14" font-weight="600" fill="#000000">Activity Intensity</text>
        <rect x="0" y="15" width="400" height="20" rx="4" fill="url(#heatGradient)"/>
        <text x="0" y="52"
              fill="#44494D">Low (0)</text>
        <text x="200" y="52"
              fill="#44494D" text-anchor="middle">Med (50)</text>
        <text x="400" y="52"
              fill="#44494D" text-anchor="end">High (100)</text>
    </g>
    <!-- Stats Panel -->
    <g id="statsPanel" transform="translate(800, 230)">
        <rect x="0" y="0" width="400" height="190" rx="8" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1"/>
        <text x="200" y="28"
              font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Key Statistics</text>
        <line x1="15" y1="42" x2="385" y2="42" stroke="#E6E6E6" stroke-width="1"/>
        <text x="20" y="68"
              font-size="13" font-weight="600" fill="#44494D">🔥 Peak Time</text>
        <text x="20" y="88"
              fill="#EE0033">Sun 19:00-21:00 (98K)</text>
        <text x="20" y="115"
              font-size="13" font-weight="600" fill="#44494D">❄️ Low Time</text>
        <text x="20" y="135"
              fill="#000000">Sun 06:00-09:00 (10K)</text>
        <text x="20" y="162"
              font-size="13" font-weight="600" fill="#44494D">📊 Daily Avg</text>
        <text x="300" y="162"
              font-size="14" font-weight="700" fill="#000000">54.2K</text>
    </g>
    <!-- Insight Card -->
    <g id="insightCard" transform="translate(800, 440)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="400" height="140" rx="8" fill="#F2F2F2" stroke="#10B981" stroke-width="1"/>
        <text x="20" y="28"
              font-size="14" font-weight="600" fill="#28A197">💡 Key Insights</text>
        <text x="20" y="58"
              fill="#44494D">• Peak activity on weekend nights</text>
        <text x="20" y="80"
              fill="#44494D">• Mid-day spikes on weekdays</text>
        <text x="20" y="102"
              fill="#44494D">• Lowest traffic in early hours</text>
        <text x="20" y="126"
              font-weight="600" fill="#44494D">Action: Scale servers on weekends</text>
    </g>
    <!-- Data Source -->
    <g id="source">
        <text x="60" y="695"
              font-size="14" fill="#999999">Source: User Behavior Analytics Platform</text>
    </g>
</svg>
