<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Stock Chart Template
    Purpose: OHLC price movement over ordered dates
    Use cases: securities, commodities, exchange rates
    Feature: Solid candlestick fallback, day KPI strip, editable stock chart marker
    -->

    <rect width="1280" height="720" fill="#FFFFFF"/>
    <g id="header">
        <text x="60" y="78"
              font-size="34" font-weight="800" fill="#000000"><tspan>Five-Day OHLC Movement</tspan></text>
        <text x="60" y="112"
              font-size="14" font-weight="700" fill="#44494D" letter-spacing="1"><tspan>SAMPLE EQUITY PRICE · OPEN, HIGH, LOW, CLOSE</tspan></text>
    </g>
    <g id="stock_chart" data-viettel-blue-scope="chart">
        <g id="chartArea">
            <rect x="80" y="140" width="900" height="460" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
            <line x1="140" y1="540" x2="920" y2="540" stroke="#999999" stroke-width="2"/>
            <line x1="140" y1="180" x2="140" y2="540" stroke="#999999" stroke-width="2"/>
            <line x1="140" y1="450" x2="920" y2="450" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="4,4"/>
            <line x1="140" y1="360" x2="920" y2="360" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="4,4"/>
            <line x1="140" y1="270" x2="920" y2="270" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="4,4"/>
            <!-- chart-plot-area: 140,180,920,540 -->
            <text x="122" y="545" font-weight="700" fill="#44494D" text-anchor="end"><tspan>96</tspan></text>
            <text x="122" y="455" font-weight="700" fill="#44494D" text-anchor="end"><tspan>104</tspan></text>
            <text x="122" y="365" font-weight="700" fill="#44494D" text-anchor="end"><tspan>112</tspan></text>
            <text x="122" y="275" font-weight="700" fill="#44494D" text-anchor="end"><tspan>120</tspan></text>
            <g id="day-1">
                <line x1="230" y1="270" x2="230" y2="495" stroke="#10B981" stroke-width="3"/>
                <rect x="204" y="315" width="52" height="67" rx="4" fill="#10B981" stroke="#059669" stroke-width="2"/>
            </g>
            <g id="day-2">
                <line x1="380" y1="247" x2="380" y2="460" stroke="#EE0033" stroke-width="3"/>
                <rect x="354" y="315" width="52" height="34" rx="4" fill="#EE0033" stroke="#EE0033" stroke-width="2"/>
            </g>
            <g id="day-3">
                <line x1="530" y1="225" x2="530" y2="438" stroke="#10B981" stroke-width="3"/>
                <rect x="504" y="270" width="52" height="79" rx="4" fill="#10B981" stroke="#059669" stroke-width="2"/>
            </g>
            <g id="day-4">
                <line x1="680" y1="180" x2="680" y2="370" stroke="#10B981" stroke-width="3"/>
                <rect x="654" y="225" width="52" height="67" rx="4" fill="#10B981" stroke="#059669" stroke-width="2"/>
            </g>
            <g id="day-5">
                <line x1="830" y1="158" x2="830" y2="303" stroke="#10B981" stroke-width="3"/>
                <rect x="804" y="202" width="52" height="67" rx="4" fill="#10B981" stroke="#059669" stroke-width="2"/>
            </g>
            <text x="230" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Mon</tspan></text>
            <text x="380" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Tue</tspan></text>
            <text x="530" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Wed</tspan></text>
            <text x="680" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Thu</tspan></text>
            <text x="830" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Fri</tspan></text>
        </g>
    </g>
    <g id="summaryPanel" transform="translate(1010, 170)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="220" height="360" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="24" y="38" font-size="16" font-weight="800" fill="#000000"><tspan>Trading Summary</tspan></text>
        <line x1="24" y1="58" x2="196" y2="58" stroke="#E6E6E6"/>
        <text x="24" y="96" font-size="13" font-weight="700" fill="#44494D"><tspan>Close change</tspan></text>
        <text x="24" y="126" font-size="28" font-weight="800" fill="#28A197"><tspan>+14.8%</tspan></text>
        <text x="24" y="172" font-size="13" font-weight="700" fill="#44494D"><tspan>High-low range</tspan></text>
        <text x="24" y="202" font-size="28" font-weight="800" fill="#000000"><tspan>28</tspan></text>
        <rect x="24" y="250" width="172" height="62" rx="8" fill="#F2F2F2" stroke="#10B981" stroke-opacity="0.25"/>
        <text x="42" y="278" font-size="13" font-weight="800" fill="#28A197"><tspan>Four sessions</tspan></text>
        <text x="42" y="300" font-size="13" font-weight="700" fill="#44494D"><tspan>closed above open.</tspan></text>
    </g>
    <g id="source">
        <text x="60" y="695"
              font-size="14" font-weight="600" fill="#999999"><tspan>Data Source: Market Data Feed</tspan></text>
    </g>
</svg>
