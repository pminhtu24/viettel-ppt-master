<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!-- Generic grouped table with indentation, subtotals and a grand total. -->
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header">
        <text x="80" y="72" font-size="32" font-weight="700" fill="#000000">Hierarchical Table</text>
        <text x="80" y="102" font-size="14" fill="#44494D">Groups, indented items, subtotals and a grand total across stable measure columns</text>
    </g>

    <g id="hierarchical-table" data-viettel-blue-scope="chart">

        <!-- Row treatments. -->
        <rect x="80" y="145" width="1120" height="50" fill="#E6E6E6"/>
        <rect x="80" y="195" width="1120" height="50" fill="#F2F2F2"/>
        <rect x="80" y="345" width="1120" height="50" fill="#F2F2F2"/>
        <rect x="80" y="395" width="1120" height="50" fill="#F2F2F2"/>
        <rect x="80" y="545" width="1120" height="50" fill="#F2F2F2"/>
        <rect x="80" y="595" width="1120" height="50" fill="#12436D"/>

        <!-- Stable grid. -->
        <rect x="80" y="145" width="1120" height="500" fill="none" stroke="#E6E6E6" stroke-width="1.5"/>
        <g stroke="#E6E6E6" stroke-width="1">
            <line x1="480" y1="145" x2="480" y2="645"/>
            <line x1="660" y1="145" x2="660" y2="645"/>
            <line x1="840" y1="145" x2="840" y2="645"/>
            <line x1="1020" y1="145" x2="1020" y2="645"/>
            <line x1="80" y1="195" x2="1200" y2="195"/>
            <line x1="80" y1="245" x2="1200" y2="245"/>
            <line x1="80" y1="295" x2="1200" y2="295"/>
            <line x1="80" y1="345" x2="1200" y2="345"/>
            <line x1="80" y1="395" x2="1200" y2="395"/>
            <line x1="80" y1="445" x2="1200" y2="445"/>
            <line x1="80" y1="495" x2="1200" y2="495"/>
            <line x1="80" y1="545" x2="1200" y2="545"/>
            <line x1="80" y1="595" x2="1200" y2="595"/>
        </g>

        <!-- Column headers. -->
        <g font-size="13" font-weight="700" fill="#44494D">
            <text x="100" y="177">ITEM</text>
            <text x="640" y="177" text-anchor="end">PERIOD 1</text>
            <text x="820" y="177" text-anchor="end">PERIOD 2</text>
            <text x="1000" y="177" text-anchor="end">TOTAL</text>
            <text x="1180" y="177" text-anchor="end">CHANGE</text>
        </g>

        <!-- Group A. -->
        <g font-size="15">
            <text x="100" y="227" font-weight="700" fill="#000000">Group A</text>
            <text x="130" y="277" fill="#44494D">Item A1</text>
            <text x="640" y="277" text-anchor="end">120</text>
            <text x="820" y="277" text-anchor="end">138</text>
            <text x="1000" y="277" text-anchor="end" font-weight="700">258</text>
            <text x="1180" y="277" text-anchor="end" font-weight="700" fill="#28A197">+15%</text>
            <text x="130" y="327" fill="#44494D">Item A2</text>
            <text x="640" y="327" text-anchor="end">80</text>
            <text x="820" y="327" text-anchor="end">92</text>
            <text x="1000" y="327" text-anchor="end" font-weight="700">172</text>
            <text x="1180" y="327" text-anchor="end" font-weight="700" fill="#28A197">+15%</text>
            <g font-weight="700" fill="#12436D">
                <text x="100" y="377">Subtotal A</text>
                <text x="640" y="377" text-anchor="end">200</text>
                <text x="820" y="377" text-anchor="end">230</text>
                <text x="1000" y="377" text-anchor="end">430</text>
                <text x="1180" y="377" text-anchor="end" fill="#28A197">+15%</text>
            </g>
        </g>

        <!-- Group B. -->
        <g font-size="15">
            <text x="100" y="427" font-weight="700" fill="#000000">Group B</text>
            <text x="130" y="477" fill="#44494D">Item B1</text>
            <text x="640" y="477" text-anchor="end">140</text>
            <text x="820" y="477" text-anchor="end">126</text>
            <text x="1000" y="477" text-anchor="end" font-weight="700">266</text>
            <text x="1180" y="477" text-anchor="end" font-weight="700" fill="#EE0033">-10%</text>
            <text x="130" y="527" fill="#44494D">Item B2</text>
            <text x="640" y="527" text-anchor="end">60</text>
            <text x="820" y="527" text-anchor="end">72</text>
            <text x="1000" y="527" text-anchor="end" font-weight="700">132</text>
            <text x="1180" y="527" text-anchor="end" font-weight="700" fill="#28A197">+20%</text>
            <g font-weight="700" fill="#12436D">
                <text x="100" y="577">Subtotal B</text>
                <text x="640" y="577" text-anchor="end">200</text>
                <text x="820" y="577" text-anchor="end">198</text>
                <text x="1000" y="577" text-anchor="end">398</text>
                <text x="1180" y="577" text-anchor="end" fill="#EE0033">-1%</text>
            </g>
        </g>

        <!-- Grand total. -->
        <g font-size="16" font-weight="700" fill="#FFFFFF">
            <text x="100" y="627">Grand Total</text>
            <text x="640" y="627" text-anchor="end">400</text>
            <text x="820" y="627" text-anchor="end">428</text>
            <text x="1000" y="627" text-anchor="end">828</text>
            <text x="1180" y="627" text-anchor="end">+7%</text>
        </g>
    </g>
</svg>
