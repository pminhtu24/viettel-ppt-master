<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Pie of Pie Chart Template
    Purpose: Expand small pie slices into a secondary pie
    Use cases: revenue mix with long-tail categories, survey results, expense composition
    Feature: pie with its small slices expanded into a secondary pie
    -->

    <rect width="1280" height="720" fill="#FFFFFF"/>
    <g id="header">
        <text x="60" y="78"
              font-size="34" font-weight="800" fill="#000000"><tspan>Category Share with Long Tail</tspan></text>
        <text x="60" y="112"
              font-size="14" font-weight="700" fill="#44494D" letter-spacing="1"><tspan>PIE OF PIE · SECONDARY DETAIL FOR SMALL SEGMENTS</tspan></text>
    </g>
    <g id="pie_of_pie_chart" data-viettel-blue-scope="chart">
        <g id="chartArea">
            <rect x="80" y="145" width="900" height="450" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
            <!-- chart-plot-area: pie-of-pie | main-center: 360,370 | main-radius: 170 | secondary-center: 785,370 | secondary-radius: 110 -->
            <g id="mainPie">
                <circle cx="360" cy="370" r="170" fill="#F2F2F2"/>
                <path d="M 360,370 L 360,200 A 170,170 0 1,1 307.5,531.7 Z" fill="#12436D" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 360,370 L 307.5,531.7 A 170,170 0 0,1 198.3,317.5 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 360,370 L 198.3,317.5 A 170,170 0 0,1 360,200 Z" fill="#F46A25" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <text x="360" y="374" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>82%</tspan></text>
                <text x="360" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Primary slices</tspan></text>
            </g>
            <g id="connectorLines">
                <line x1="515" y1="300" x2="675" y2="275" stroke="#E6E6E6" stroke-width="2"/>
                <line x1="515" y1="440" x2="675" y2="465" stroke="#E6E6E6" stroke-width="2"/>
            </g>
            <g id="secondaryPie">
                <circle cx="785" cy="370" r="110" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="2"/>
                <path d="M 785,370 L 785,260 A 110,110 0 0,1 890,396 Z" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 785,370 L 890,396 A 110,110 0 0,1 728,464 Z" fill="#7C3AED" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 785,370 L 728,464 A 110,110 0 0,1 785,260 Z" fill="#999999" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <text x="785" y="375" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>18%</tspan></text>
                <text x="785" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Expanded tail</tspan></text>
            </g>
        </g>
    </g>
    <g id="splitPanel" transform="translate(1010, 170)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="220" height="360" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="24" y="38" font-size="16" font-weight="800" fill="#000000"><tspan>Split Logic</tspan></text>
        <line x1="24" y1="58" x2="196" y2="58" stroke="#E6E6E6"/>
        <text x="24" y="95" font-size="13" font-weight="700" fill="#44494D"><tspan>Main pie</tspan></text>
        <text x="24" y="124" font-size="28" font-weight="800" fill="#000000"><tspan>82%</tspan></text>
        <text x="24" y="165" font-size="13" font-weight="700" fill="#44494D"><tspan>Tail detail</tspan></text>
        <text x="24" y="194" font-size="28" font-weight="800" fill="#000000"><tspan>18%</tspan></text>
        <rect x="24" y="235" width="172" height="78" rx="8" fill="#F2F2F2" stroke="#12436D" stroke-opacity="0.25"/>
        <text x="42" y="263" font-size="13" font-weight="800" fill="#000000"><tspan>Best when</tspan></text>
        <text x="42" y="286" font-weight="600" fill="#44494D"><tspan>small slices still need</tspan></text>
        <text x="42" y="304" font-weight="600" fill="#44494D"><tspan>individual labels.</tspan></text>
    </g>
    <g id="source">
        <text x="60" y="695"
              font-size="14" font-weight="600" fill="#999999"><tspan>Data Source: Product Analytics</tspan></text>
    </g>
</svg>
