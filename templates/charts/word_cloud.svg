<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Word Cloud Chart Template
    Purpose: Keyword weight visualization, trending topics
    Use cases: User feedback analysis, industry trends, tech stack overview
    Feature: Mathematically mapped geometric distribution and non-overlapping weighted typography
    -->
    <!-- Background -->
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <!-- ==================== Header ==================== -->
    <g id="header">
        <text x="640" y="60" text-anchor="middle" font-size="32" font-weight="800" fill="#000000">Industry Trending Keywords</text>
        <text x="640" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#44494D" letter-spacing="1">WORD CLOUD · FONT SIZE INDICATES KEYWORD WEIGHT &amp; FREQUENCY</text>
    </g>
    <!-- ==================== Word Cloud Geometry ==================== -->
    <g id="word-cloud-body" text-anchor="middle">
        <!-- Tier 1: Extreme (Center Core) -->
        <g font-weight="900" font-size="64" letter-spacing="-1">
            <text x="640" y="340" fill="#000000">Artificial Intelligence</text>
            <text x="640" y="420" fill="#000000">Large Language Models</text>
        </g>
        <!-- Tier 2: High (Inner Ring) -->
        <g font-weight="800" font-size="44" letter-spacing="-0.5">
            <text x="320" y="280" fill="#EE0033">Digital Transformation</text>
            <text x="960" y="280" fill="#000000">Cloud Computing</text>
            <text x="320" y="480" fill="#28A197">Smart Manufacturing</text>
            <text x="960" y="480" fill="#F46A25">Data Security</text>
        </g>
        <!-- Tier 3: Medium (Middle Ring) -->
        <g font-weight="700" font-size="32">
            <text x="640" y="240" fill="#28A197">Autonomous Driving</text>
            <text x="640" y="500" fill="#000000">Edge Computing</text>
            <text x="180" y="380" fill="#000000">Metaverse</text>
            <text x="1100" y="380" fill="#000000">Blockchain</text>
            <text x="440" y="200" fill="#000000">Quantum Computing</text>
            <text x="840" y="200" fill="#FFFFFF">Machine Learning</text>
            <text x="440" y="560" fill="#28A197">Digital Twins</text>
            <text x="840" y="560" fill="#F46A25">IoT / AIoT</text>
        </g>
        <!-- Tier 4: Low (Outer Ring) -->
        <g font-weight="600" font-size="24" fill="#44494D">
            <text x="240" y="180">Web 3.0</text>
            <text x="1040" y="180">Low-Code</text>
            <text x="240" y="580">Zero Trust</text>
            <text x="1040" y="580">Knowledge Graphs</text>
            <text x="140" y="280">Multimodal AI</text>
            <text x="1140" y="280">Federated Learning</text>
            <text x="140" y="480">AIGC</text>
            <text x="1140" y="480">Privacy Computing</text>
            <text x="640" y="160">RPA</text>
            <text x="640" y="580">GPT-4</text>
        </g>
        <!-- Tier 5: Minimum (Dust/Particles) -->
        <g font-weight="500" font-size="16" fill="#999999">
            <text x="140" y="120">DevOps</text>
            <text x="1140" y="120">MLOps</text>
            <text x="140" y="640">Cybersecurity</text>
            <text x="1140" y="640">Spatial Computing</text>
            <text x="500" y="260">Data Mesh</text>
            <text x="780" y="260">API First</text>
            <text x="500" y="500">Serverless</text>
            <text x="780" y="500">Microservices</text>
            <text x="80" y="380">SaaS</text>
            <text x="1200" y="380">PaaS</text>
        </g>
    </g>
    <!-- ==================== UI Legend ==================== -->
    <g id="frequency-legend">
        <rect x="340" y="640" width="600" height="40" rx="20" fill="#FFFFFF"/>
        <text x="640" y="665" font-size="14" font-weight="600" fill="#44494D" text-anchor="middle">
            Size indicates frequency:
            <tspan fill="#000000" font-weight="800"> Extreme</tspan> ·
            <tspan fill="#EE0033" font-weight="700"> High</tspan> ·
            <tspan fill="#28A197" font-weight="600"> Medium</tspan> ·
            <tspan fill="#44494D" font-weight="500"> Low</tspan>
        </text>
    </g>
    <!-- ==================== Footer ==================== -->
    <g id="source">
        <text x="1220" y="700" text-anchor="end" font-weight="600" fill="#999999">Data Source: Industry Reports &amp; Social Media Analysis · 2025</text>
    </g>
</svg>
