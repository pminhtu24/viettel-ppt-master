<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Isometric Stairs Chart Template
    Usage: Progressive stages, growth paths, maturity models
    Scenarios: Digital transformation phases, capability maturity, strategic milestones
    Supports: 6 Steps (Recommended 4-7)
    Design Principles:
      - Each step = top parallelogram + front face + side face (3 shades from one Tailwind hue, see CHART_STYLE_GUIDE §1.2)
      - Step palette walks the spectrum Sky -> Blue -> Indigo -> Violet -> Purple -> Rose
      - Visual weight: thicker top-edge highlight (2.5px), heavier shadow, larger numbers (font 34 weight 900),
        each description anchored by a tinted background card so it does not float
      - Ground line beneath bottom stair anchors the staircase to the page
    -->
    <defs>
        <filter id="stairShadow" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="2" dy="5" result="offsetblur"/>
            <feFlood flood-color="#0F172A" flood-opacity="0.18" result="shadowColor"/>
            <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
            <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1280" height="720" fill="#FFFFFF"/>

    <!-- ==================== Header ==================== -->
    <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="#000000"><tspan>Digital Transformation Roadmap</tspan></text>
    <text x="60" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#44494D" letter-spacing="1.5"><tspan>STRATEGIC MILESTONES · SIX-STAGE PROGRESSIVE PATH</tspan></text>

    <!-- Ground line: dashed faint line at the base where the bottom stair lands; anchors the climb visually -->
    <line x1="60" y1="600" x2="1220" y2="600" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="6,6"/>

    <!-- ==================== Stair 1 (Sky) ==================== -->
    <g id="stair-01" transform="translate(80, 480)" filter="url(#stairShadow)" data-viettel-blue-scope="chart">
        <polygon points="0,0 130,-38 260,0 130,38" fill="#12436D"/>
        <polygon points="0,0 0,72 130,110 130,38" fill="#12436D"/>
        <polygon points="130,38 130,110 260,72 260,0" fill="#12436D"/>
        <polyline points="0,0 130,-38 260,0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.7"/>
        <text x="130" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF"><tspan>01</tspan></text>
    </g>
    <g id="label-01" data-viettel-blue-scope="chart">
        <rect x="100" y="615" width="220" height="50" rx="8" fill="#F2F2F2" stroke="#12436D" stroke-width="1.5" stroke-opacity="0.25"/>
        <text x="210" y="636" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#000000"><tspan>Foundational IT</tspan></text>
        <text x="210" y="654" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#000000"><tspan>Infrastructure setup</tspan></text>
    </g>

    <!-- ==================== Stair 2 (Blue) ==================== -->
    <g id="stair-02" transform="translate(230, 410)" filter="url(#stairShadow)" data-viettel-blue-scope="chart">
        <polygon points="0,0 130,-38 260,0 130,38" fill="#12436D"/>
        <polygon points="0,0 0,72 130,110 130,38" fill="#12436D"/>
        <polygon points="130,38 130,110 260,72 260,0" fill="#12436D"/>
        <polyline points="0,0 130,-38 260,0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.7"/>
        <text x="130" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF"><tspan>02</tspan></text>
    </g>
    <g id="label-02" data-viettel-blue-scope="chart">
        <rect x="250" y="545" width="220" height="50" rx="8" fill="#F2F2F2" stroke="#12436D" stroke-width="1.5" stroke-opacity="0.25"/>
        <text x="360" y="566" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#000000"><tspan>Process Digitization</tspan></text>
        <text x="360" y="584" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#000000"><tspan>Core business online</tspan></text>
    </g>

    <!-- ==================== Stair 3 (Indigo) ==================== -->
    <g id="stair-03" transform="translate(380, 340)" filter="url(#stairShadow)" data-viettel-blue-scope="chart">
        <polygon points="0,0 130,-38 260,0 130,38" fill="#12436D" fill-opacity="0.45"/>
        <polygon points="0,0 0,72 130,110 130,38" fill="#12436D"/>
        <polygon points="130,38 130,110 260,72 260,0" fill="#12436D"/>
        <polyline points="0,0 130,-38 260,0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.65"/>
        <text x="130" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF"><tspan>03</tspan></text>
    </g>
    <g id="label-03" data-viettel-blue-scope="chart">
        <rect x="400" y="475" width="220" height="50" rx="8" fill="#F2F2F2" stroke="#12436D" stroke-width="1.5" stroke-opacity="0.25"/>
        <text x="510" y="496" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#000000"><tspan>Data Driven</tspan></text>
        <text x="510" y="514" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#000000"><tspan>Analytics &amp; insights</tspan></text>
    </g>

    <!-- ==================== Stair 4 (Violet) ==================== -->
    <g id="stair-04" transform="translate(530, 270)" filter="url(#stairShadow)" data-viettel-blue-scope="chart">
        <polygon points="0,0 130,-38 260,0 130,38" fill="#7C3AED" fill-opacity="0.45"/>
        <polygon points="0,0 0,72 130,110 130,38" fill="#7C3AED"/>
        <polygon points="130,38 130,110 260,72 260,0" fill="#7C3AED"/>
        <polyline points="0,0 130,-38 260,0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.6"/>
        <text x="130" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF"><tspan>04</tspan></text>
    </g>
    <g id="label-04">
        <rect x="550" y="405" width="220" height="50" rx="8" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="660" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#000000"><tspan>Intelligent Ops</tspan></text>
        <text x="660" y="444" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#000000"><tspan>AI-augmented work</tspan></text>
    </g>

    <!-- ==================== Stair 5 (Purple) ==================== -->
    <g id="stair-05" transform="translate(680, 200)" filter="url(#stairShadow)" data-viettel-blue-scope="chart">
        <polygon points="0,0 130,-38 260,0 130,38" fill="#7C3AED" fill-opacity="0.45"/>
        <polygon points="0,0 0,72 130,110 130,38" fill="#7C3AED"/>
        <polygon points="130,38 130,110 260,72 260,0" fill="#7C3AED"/>
        <polyline points="0,0 130,-38 260,0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.55"/>
        <text x="130" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF"><tspan>05</tspan></text>
    </g>
    <g id="label-05" data-viettel-blue-scope="chart">
        <rect x="700" y="335" width="220" height="50" rx="8" fill="#F2F2F2" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.12"/>
        <text x="810" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#000000"><tspan>Ecosystem Integration</tspan></text>
        <text x="810" y="374" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#000000"><tspan>Platform collaboration</tspan></text>
    </g>

    <!-- ==================== Stair 6 (Rose, peak) ==================== -->
    <g id="stair-06" transform="translate(830, 130)" filter="url(#stairShadow)">
        <polygon points="0,0 130,-38 260,0 130,38" fill="#EE0033" fill-opacity="0.45"/>
        <polygon points="0,0 0,72 130,110 130,38" fill="#EE0033"/>
        <polygon points="130,38 130,110 260,72 260,0" fill="#EE0033"/>
        <polyline points="0,0 130,-38 260,0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5"/>
        <text x="130" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF"><tspan>06</tspan></text>
    </g>
    <g id="label-06">
        <rect x="850" y="265" width="220" height="50" rx="8" fill="#F2F2F2" stroke="#EE0033" stroke-width="1.5" stroke-opacity="0.12"/>
        <text x="960" y="286" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#000000"><tspan>Industry Leadership</tspan></text>
        <text x="960" y="304" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#EE0033"><tspan>Standard setting</tspan></text>
    </g>
</svg>
