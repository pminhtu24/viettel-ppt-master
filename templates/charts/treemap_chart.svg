<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Treemap Chart Template
    Purpose: Hierarchical data proportion visualization
    Use cases: Budget allocation, market share, storage analysis, portfolio
    Feature: Proportional tile layout, hierarchical labels, and semantic category colors
    -->
    <!-- Background -->
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- ==================== Header ==================== -->
    <g id="header">
        <text x="60" y="70" font-size="32" font-weight="800" fill="#000000">Annual Budget Allocation</text>
        <text x="60" y="100" font-size="14" font-weight="700" fill="#44494D" letter-spacing="1">2025 BUDGET · TOTAL $12.0M · AREA REPRESENTS ALLOCATION %</text>
    </g>
    <!-- ==================== Treemap Area (1000x480) ==================== -->
    <g id="treemap_chart" data-viettel-blue-scope="chart">
    <g id="treemapArea" transform="translate(60, 130)">
        <!-- 1. HUMAN RESOURCES (40%) - Sky Palette -->
        <g id="hr_cost">
            <!-- 1.1 Salaries & Benefits (28%) -->
            <rect x="0" y="0" width="400" height="336" rx="8" fill="#12436D"/>
            <text x="20" y="32" font-size="14" font-weight="800" fill="#F2F2F2" letter-spacing="1">HUMAN RESOURCES (40%)</text>
            <text x="200" y="170" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">Salaries &amp; Benefits</text>
            <text x="200" y="210" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">$3.36M</text>
            <text x="200" y="240" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">28% of total</text>
            <!-- 1.2 Training (6%) -->
            <rect x="0" y="340" width="198" height="140" rx="8" fill="#12436D"/>
            <text x="99" y="395" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Training</text>
            <text x="99" y="425" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">$0.72M</text>
            <text x="99" y="450" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">6%</text>
            <!-- 1.3 Recruitment (6%) -->
            <rect x="202" y="340" width="198" height="140" rx="8" fill="#12436D"/>
            <text x="301" y="395" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Recruitment</text>
            <text x="301" y="425" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">$0.72M</text>
            <text x="301" y="450" font-size="13" font-weight="700" fill="#F2F2F2" text-anchor="middle">6%</text>
        </g>
        <!-- 2. OPERATIONS (25%) - Emerald Palette -->
        <g id="operation_cost">
            <!-- 2.1 Office Space (12.5%) -->
            <rect x="404" y="0" width="296" height="200" rx="8" fill="#059669"/>
            <text x="424" y="32" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">OPERATIONS (25%)</text>
            <text x="552" y="110" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Office Space</text>
            <text x="552" y="145" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle">$1.50M</text>
            <text x="552" y="170" font-size="14" font-weight="700" fill="#28A197" text-anchor="middle">12.5%</text>
            <!-- 2.2 Equipment (7.5%) -->
            <rect x="704" y="0" width="176" height="200" rx="8" fill="#10B981"/>
            <text x="792" y="90" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Equipment</text>
            <text x="792" y="125" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">$0.90M</text>
            <text x="792" y="150" font-size="13" font-weight="700" fill="#28A197" text-anchor="middle">7.5%</text>
            <!-- 2.3 Daily Ops (5%) -->
            <rect x="884" y="0" width="116" height="200" rx="8" fill="#10B981"/>
            <text x="942" y="90" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Daily Ops</text>
            <text x="942" y="120" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">$0.60M</text>
            <text x="942" y="145" font-weight="700" fill="#28A197" text-anchor="middle">5%</text>
        </g>
        <!-- 3. MARKETING (20%) - Amber Palette -->
        <g id="marketing_cost">
            <!-- 3.1 Advertising (12%) -->
            <rect x="404" y="204" width="356" height="156" rx="8" fill="#F46A25"/>
            <text x="424" y="236" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">MARKETING (20%)</text>
            <text x="582" y="295" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Advertising</text>
            <text x="582" y="330" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">$1.44M</text>
            <!-- 3.2 Brand Events (8%) -->
            <rect x="764" y="204" width="236" height="156" rx="8" fill="#F46A25"/>
            <text x="882" y="280" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Brand Events</text>
            <text x="882" y="315" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">$0.96M</text>
            <text x="882" y="340" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">8%</text>
        </g>
        <!-- 4. R&D (10%) - Violet Palette -->
        <g id="rd_cost">
            <rect x="404" y="364" width="296" height="116" rx="8" fill="#7C3AED"/>
            <text x="424" y="396" font-size="14" font-weight="800" fill="#F2F2F2" letter-spacing="1">R&amp;D (10%)</text>
            <text x="552" y="440" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">$1.20M</text>
        </g>
        <!-- 5. OTHER (5%) - Slate Palette -->
        <g id="other_cost">
            <rect x="704" y="364" width="296" height="116" rx="8" fill="#44494D"/>
            <text x="724" y="396" font-size="14" font-weight="800" fill="#F2F2F2" letter-spacing="1">OTHER (5%)</text>
            <text x="852" y="440" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">$0.60M</text>
        </g>
    </g>
    </g>
    <!-- ==================== UI Panels ==================== -->
    <!-- Dashboard Legend Panel -->
    <g id="legend" transform="translate(1080, 130)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="160" height="260" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="80" y="32" font-size="13" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="0.5">BUDGET SUMMARY</text>
        <line x1="20" y1="50" x2="140" y2="50" stroke="#F2F2F2" stroke-width="2"/>
        <rect x="20" y="65" width="16" height="16" rx="4" fill="#12436D"/>
        <text x="46" y="78" font-weight="700" fill="#44494D">HR (40%)</text>
        <rect x="20" y="95" width="16" height="16" rx="4" fill="#059669"/>
        <text x="46" y="108" font-weight="700" fill="#44494D">Ops (25%)</text>
        <rect x="20" y="125" width="16" height="16" rx="4" fill="#F46A25"/>
        <text x="46" y="138" font-weight="700" fill="#44494D">Market (20%)</text>
        <rect x="20" y="155" width="16" height="16" rx="4" fill="#7C3AED"/>
        <text x="46" y="168" font-weight="700" fill="#44494D">R&amp;D (10%)</text>
        <rect x="20" y="185" width="16" height="16" rx="4" fill="#44494D"/>
        <text x="46" y="198" font-weight="700" fill="#44494D">Other (5%)</text>
        <line x1="20" y1="215" x2="140" y2="215" stroke="#F2F2F2" stroke-width="2"/>
        <text x="80" y="240" font-size="15" font-weight="800" fill="#000000" text-anchor="middle">Total: $12.0M</text>
    </g>
    <!-- Info Panel -->
    <g id="note" transform="translate(1080, 410)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="160" height="90" rx="12" fill="#F2F2F2" stroke="#12436D" stroke-width="1.5" stroke-opacity="0.25"/>
        <text x="16" y="28" font-weight="800" fill="#000000" letter-spacing="0.5">HOW TO READ</text>
        <text x="16" y="48" font-weight="600" fill="#44494D">Area size directly<tspan x="16" dy="16">represents the</tspan><tspan x="16" dy="16">budget allocation %</tspan></text>
    </g>
    <!-- ==================== Footer ==================== -->
    <g id="source">
        <text x="60" y="690" font-size="13" font-weight="600" fill="#999999">Data Source: Finance Dept Annual Budget Report</text>
    </g>
</svg>
