<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Histogram Chart Template
    Purpose: Numeric distribution shape from raw observations
    Use cases: cycle time, order value, response latency, quality measurements
    Feature: Binned bars, median marker, right-side interpretation card
    -->

    <rect width="1280" height="720" fill="#FFFFFF"/>
    <g id="header">
        <text x="60" y="70"
              font-size="34" font-weight="800" fill="#000000"><tspan>Order Value Distribution</tspan></text>
        <text x="60" y="100"
              font-size="14" font-weight="700" fill="#44494D" letter-spacing="1"><tspan>SAMPLE ORDERS · USD THOUSANDS</tspan></text>
    </g>
    <g id="histogram_chart" data-viettel-blue-scope="chart">
        <g id="chartArea">
            <rect x="80" y="130" width="900" height="500" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
            <line x1="150" y1="560" x2="920" y2="560" stroke="#999999" stroke-width="2"/>
            <line x1="150" y1="170" x2="150" y2="560" stroke="#999999" stroke-width="2"/>
            <line x1="150" y1="462" x2="920" y2="462" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line x1="150" y1="364" x2="920" y2="364" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line x1="150" y1="266" x2="920" y2="266" stroke="#E6E6E6" stroke-width="1.5" stroke-dasharray="5,5"/>
            <!-- chart-plot-area: 150,170,920,560 -->
            <rect x="185" y="430" width="82" height="130" rx="6" fill="#12436D" fill-opacity="0.25"/>
            <rect x="285" y="330" width="82" height="230" rx="6" fill="#12436D" fill-opacity="0.45"/>
            <rect x="385" y="230" width="82" height="330" rx="6" fill="#12436D"/>
            <rect x="485" y="270" width="82" height="290" rx="6" fill="#12436D"/>
            <rect x="585" y="360" width="82" height="200" rx="6" fill="#12436D"/>
            <rect x="685" y="450" width="82" height="110" rx="6" fill="#12436D"/>
            <rect x="785" y="500" width="82" height="60" rx="6" fill="#12436D"/>
            <line x1="515" y1="170" x2="515" y2="560" stroke="#EE0033" stroke-width="2.5" stroke-dasharray="6,5"/>
            <rect x="472" y="182" width="86" height="28" rx="14" fill="#F2F2F2" stroke="#EE0033" stroke-opacity="0.25"/>
            <text x="515" y="202"
 font-weight="800" fill="#EE0033" text-anchor="middle"><tspan>Median</tspan></text>
            <text x="226" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>10-20</tspan></text>
            <text x="326" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>20-30</tspan></text>
            <text x="426" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>30-40</tspan></text>
            <text x="526" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>40-50</tspan></text>
            <text x="626" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>50-60</tspan></text>
            <text x="726" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>60-70</tspan></text>
            <text x="826" y="590" font-size="13" font-weight="600" fill="#44494D" text-anchor="middle"><tspan>70-80</tspan></text>
        </g>
    </g>
    <g id="insightPanel" transform="translate(1010, 170)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="220" height="360" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="24" y="38" font-size="16" font-weight="800" fill="#000000"><tspan>Distribution Notes</tspan></text>
        <line x1="24" y1="58" x2="196" y2="58" stroke="#E6E6E6"/>
        <text x="24" y="95" font-size="13" font-weight="700" fill="#44494D"><tspan>Peak bin</tspan></text>
        <text x="24" y="124" font-size="28" font-weight="800" fill="#000000"><tspan>30-40K</tspan></text>
        <text x="24" y="165" font-size="13" font-weight="700" fill="#44494D"><tspan>Observation count</tspan></text>
        <text x="24" y="194" font-size="28" font-weight="800" fill="#000000"><tspan>25</tspan></text>
        <rect x="24" y="235" width="172" height="72" rx="8" fill="#F2F2F2" stroke="#12436D" stroke-opacity="0.25"/>
        <text x="42" y="263" font-size="13" font-weight="800" fill="#000000"><tspan>Right tail exists</tspan></text>
        <text x="42" y="280" font-weight="600" fill="#44494D">Large orders remain<tspan x="42" dy="17">sparse.</tspan></text>
    </g>
    <g id="source">
        <text x="60" y="690"
              font-size="14" font-weight="600" fill="#999999"><tspan>Data Source: Commerce Analytics</tspan></text>
    </g>
</svg>
