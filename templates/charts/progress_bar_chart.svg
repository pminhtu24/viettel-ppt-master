<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Progress Bar Chart Template
    Purpose: Goal tracking, metric comparisons
    Use cases: OKR tracking, Project status, KPI dashboards
    Supports: 6 unified progress bars with global target axis
    -->
    <!-- Background -->
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <!-- ==================== Header Area ==================== -->
    <g id="header">
        <text x="60" y="70" font-size="32" font-weight="800" fill="#000000">Q4 2025 OKR Progress Tracking</text>
        <text x="60" y="100" font-size="14" font-weight="700" fill="#44494D" letter-spacing="1">DEADLINE: DEC 31, 2025 · 20 DAYS REMAINING</text>
    </g>
    <!-- Overall Completion Card -->
    <g id="overallProgress" transform="translate(860, 40)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="360" height="70" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="20" y="28" font-size="13" font-weight="700" fill="#44494D" letter-spacing="0.5">OVERALL COMPLETION</text>
        <text x="20" y="55" font-size="28" font-weight="800" fill="#000000">73.5%</text>
        <text x="100" y="52" font-size="14" font-weight="600" fill="#999999">/ Target 100%</text>
        <rect x="220" y="28" width="120" height="14" rx="7" fill="#F2F2F2"/>
        <rect x="220" y="28" width="88.2" height="14" rx="7" fill="#12436D"/>
    </g>
    <!-- ==================== Progress Bars ==================== -->
    <g id="progressBars" data-viettel-blue-scope="chart">
        <!-- 1. Revenue Target (92%) -->
        <g transform="translate(60, 150)">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#000000">Revenue Target</text>
            <text x="0" y="40" font-size="13" font-weight="600" fill="#44494D">Target: $50M | Actual: $46M</text>
            <rect x="280" y="10" width="700" height="20" rx="10" fill="#F2F2F2" />
            <rect x="280" y="10" width="644" height="20" rx="10" fill="#059669"/>
            <text x="1010" y="26" font-size="20" font-weight="800" fill="#28A197">92%</text>
            <rect x="1080" y="8" width="90" height="24" rx="12" fill="#10B981" fill-opacity="0.25"/>
            <text x="1125" y="24" font-weight="800" fill="#28A197" text-anchor="middle">AHEAD</text>
        </g>
        <!-- 2. New Customer Acquisition (85%) -->
        <g transform="translate(60, 235)">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#000000">New Customer Acquisition</text>
            <text x="0" y="40" font-size="13" font-weight="600" fill="#44494D">Target: 200 Accounts | Actual: 170 Accounts</text>
            <rect x="280" y="10" width="700" height="20" rx="10" fill="#F2F2F2" />
            <rect x="280" y="10" width="595" height="20" rx="10" fill="#059669"/>
            <text x="1010" y="26" font-size="20" font-weight="800" fill="#28A197">85%</text>
            <rect x="1080" y="8" width="90" height="24" rx="12" fill="#10B981" fill-opacity="0.25"/>
            <text x="1125" y="24" font-weight="800" fill="#28A197" text-anchor="middle">ON TRACK</text>
        </g>
        <!-- 3. Product Launch (75%) -->
        <g transform="translate(60, 320)">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#000000">Product Launch</text>
            <text x="0" y="40" font-size="13" font-weight="600" fill="#44494D">Target: 4 Features | Actual: 3 Features</text>
            <rect x="280" y="10" width="700" height="20" rx="10" fill="#F2F2F2" />
            <rect x="280" y="10" width="525" height="20" rx="10" fill="#12436D"/>
            <text x="1010" y="26" font-size="20" font-weight="800" fill="#000000">75%</text>
            <rect x="1080" y="8" width="90" height="24" rx="12" fill="#E6E6E6" />
            <text x="1125" y="24" font-weight="800" fill="#000000" text-anchor="middle">IN PROGRESS</text>
        </g>
        <!-- 4. Team Expansion (68%) -->
        <g transform="translate(60, 405)">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#000000">Team Expansion</text>
            <text x="0" y="40" font-size="13" font-weight="600" fill="#44494D">Target: 25 Hires | Actual: 17 Hires</text>
            <rect x="280" y="10" width="700" height="20" rx="10" fill="#F2F2F2" />
            <rect x="280" y="10" width="476" height="20" rx="10" fill="#F46A25"/>
            <text x="1010" y="26" font-size="20" font-weight="800" fill="#F46A25">68%</text>
            <rect x="1080" y="8" width="90" height="24" rx="12" fill="#F46A25" fill-opacity="0.25"/>
            <text x="1125" y="24" font-weight="800" fill="#F46A25" text-anchor="middle">DELAYED</text>
        </g>
        <!-- 5. Cost Optimization (55%) -->
        <g transform="translate(60, 490)">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#000000">Cost Optimization</text>
            <text x="0" y="40" font-size="13" font-weight="600" fill="#44494D">Target: -20% | Actual: -11%</text>
            <rect x="280" y="10" width="700" height="20" rx="10" fill="#F2F2F2" />
            <rect x="280" y="10" width="385" height="20" rx="10" fill="#EE0033"/>
            <text x="1010" y="26" font-size="20" font-weight="800" fill="#EE0033">55%</text>
            <rect x="1080" y="8" width="90" height="24" rx="12" fill="#F2F2F2" />
            <text x="1125" y="24" font-weight="800" fill="#EE0033" text-anchor="middle">AT RISK</text>
        </g>
        <!-- 6. Brand Awareness (66%) -->
        <g transform="translate(60, 575)">
            <text x="0" y="18" font-size="16" font-weight="800" fill="#000000">Brand Awareness</text>
            <text x="0" y="40" font-size="13" font-weight="600" fill="#44494D">Target: +30% | Actual: +20%</text>
            <rect x="280" y="10" width="700" height="20" rx="10" fill="#F2F2F2" />
            <rect x="280" y="10" width="462" height="20" rx="10" fill="#F46A25"/>
            <text x="1010" y="26" font-size="20" font-weight="800" fill="#F46A25">66%</text>
            <rect x="1080" y="8" width="90" height="24" rx="12" fill="#F46A25" fill-opacity="0.25"/>
            <text x="1125" y="24" font-weight="800" fill="#F46A25" text-anchor="middle">DELAYED</text>
        </g>
    </g>
    <!-- ==================== Global Target Axis ==================== -->
    <g id="goal-marker">
        <line x1="980" y1="140" x2="980" y2="615" stroke="#999999" stroke-width="2" stroke-dasharray="6 4" />
        <rect x="945" y="125" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#999999" stroke-width="1.5" />
        <text x="980" y="141" font-weight="800" fill="#44494D" text-anchor="middle">100% GOAL</text>
    </g>
    <!-- ==================== Legend ==================== -->
    <g id="legend" transform="translate(60, 660)" data-viettel-blue-scope="chart">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#059669"/>
        <text x="24" y="13" font-size="13" font-weight="600" fill="#44494D">On Track / Ahead (≥80%)</text>
        <rect x="180" y="0" width="16" height="16" rx="4" fill="#12436D"/>
        <text x="204" y="13" font-size="13" font-weight="600" fill="#44494D">In Progress (70-80%)</text>
        <rect x="350" y="0" width="16" height="16" rx="4" fill="#F46A25"/>
        <text x="374" y="13" font-size="13" font-weight="600" fill="#44494D">Delayed (60-70%)</text>
        <rect x="510" y="0" width="16" height="16" rx="4" fill="#EE0033"/>
        <text x="534" y="13" font-size="13" font-weight="600" fill="#44494D">At Risk (&lt;60%)</text>
    </g>
    <!-- Data Source -->
    <g id="source">
        <text x="1220" y="675" font-size="13" font-weight="600" fill="#999999" text-anchor="end">Data Source: OKR Management System</text>
    </g>
</svg>
