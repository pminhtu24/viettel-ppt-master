<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Bullet Chart Template
    Purpose: Target vs Actual comparison, more space-efficient than gauges
    Use cases: KPI achievement, sales targets, budget execution, performance evaluation
    Supports: 5 metrics displayed in parallel
    -->
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <g id="header">
        <text x="640" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="34" font-weight="bold" fill="#000000" text-anchor="middle">2025 Annual KPI Achievement Status</text>
        <text x="640" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="18" fill="#44494D" text-anchor="middle">Target vs Actual - As of Q4</text>
    </g>
    <!-- Legend -->
    <g id="legend" transform="translate(820, 100)">
        <g id="legend-fair">
            <rect x="0" y="0" width="20" height="12" fill="#F2F2F2" rx="2"/>
            <text x="28" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
 fill="#44494D">Fair (0-60%)</text>
        </g>
        <g id="legend-good">
            <rect x="120" y="0" width="20" height="12" fill="#E6E6E6" rx="2"/>
            <text x="148" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
 fill="#44494D">Good (60-80%)</text>
        </g>
        <g id="legend-excellent">
            <rect x="250" y="0" width="20" height="12" fill="#E6E6E6" rx="2"/>
            <text x="278" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
 fill="#44494D">Excellent (80-100%+)</text>
        </g>
    </g>
    <!-- Bullet 1: Sales Revenue 92% -->
    <g id="bullet1" transform="translate(80, 140)" data-viettel-blue-scope="chart">
        <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="18" font-weight="600" fill="#000000">Sales Revenue</text>
        <text x="0" y="55"
              font-size="14" fill="#44494D">Target: $100M</text>
        <rect x="180" y="20" width="540" height="50" fill="#F2F2F2" rx="4"/>
        <rect x="720" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="900" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="180" y="32" width="828" height="26" fill="#10B981" rx="3"/>
        <line x1="1080" y1="15" x2="1080" y2="75" stroke="#000000" stroke-width="4"/>
        <text x="998" y="50"
              font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="end">$92M</text>
        <text x="1120" y="50"
              font-size="20" font-weight="bold" fill="#28A197">92%</text>
    </g>
    <!-- Bullet 2: New Customers 97% -->
    <g id="bullet2" transform="translate(80, 240)" data-viettel-blue-scope="chart">
        <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="18" font-weight="600" fill="#000000">New Customers</text>
        <text x="0" y="55"
              font-size="14" fill="#44494D">Target: 500</text>
        <rect x="180" y="20" width="540" height="50" fill="#F2F2F2" rx="4"/>
        <rect x="720" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="900" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="180" y="32" width="873" height="26" fill="#10B981" rx="3"/>
        <line x1="1080" y1="15" x2="1080" y2="75" stroke="#000000" stroke-width="4"/>
        <text x="1043" y="50"
              font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="end">485</text>
        <text x="1120" y="50"
              font-size="20" font-weight="bold" fill="#28A197">97%</text>
    </g>
    <!-- Bullet 3: Customer Satisfaction 98% -->
    <g id="bullet3" transform="translate(80, 340)" data-viettel-blue-scope="chart">
        <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="18" font-weight="600" fill="#000000">Customer Satisfaction</text>
        <text x="0" y="55"
              font-size="14" fill="#44494D">Target: 90%</text>
        <rect x="180" y="20" width="540" height="50" fill="#F2F2F2" rx="4"/>
        <rect x="720" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="900" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="180" y="32" width="880" height="26" fill="#10B981" rx="3"/>
        <line x1="990" y1="15" x2="990" y2="75" stroke="#000000" stroke-width="4"/>
        <text x="1050" y="50"
              font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="end">98%</text>
        <text x="1120" y="50"
              font-size="20" font-weight="bold" fill="#28A197">98%</text>
    </g>
    <!-- Bullet 4: Market Share 72% -->
    <g id="bullet4" transform="translate(80, 440)">
        <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="18" font-weight="600" fill="#000000">Market Share</text>
        <text x="0" y="55"
              font-size="14" fill="#44494D">Target: 25%</text>
        <rect x="180" y="20" width="540" height="50" fill="#F2F2F2" rx="4"/>
        <rect x="720" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="900" y="20" width="180" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="180" y="32" width="648" height="26" fill="#F46A25" rx="3"/>
        <line x1="1080" y1="15" x2="1080" y2="75" stroke="#000000" stroke-width="4"/>
        <text x="818" y="50"
              font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="end">18%</text>
        <text x="1120" y="50"
              font-size="20" font-weight="bold" fill="#F46A25">72%</text>
    </g>
    <!-- Bullet 5: Cost Control 119% (Over budget) -->
    <g id="bullet5" transform="translate(80, 540)">
        <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="18" font-weight="600" fill="#000000">Cost Control</text>
        <text x="0" y="55"
              font-size="14" fill="#44494D">Budget: $80M</text>
        <rect x="180" y="20" width="900" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="720" y="20" width="360" height="50" fill="#E6E6E6" rx="4"/>
        <rect x="900" y="20" width="180" height="50" fill="#F2F2F2" rx="4"/>
        <rect x="180" y="32" width="855" height="26" fill="#EE0033" rx="3"/>
        <line x1="720" y1="15" x2="720" y2="75" stroke="#000000" stroke-width="4"/>
        <text x="1025" y="50"
              font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="end">$95M</text>
        <text x="1120" y="50"
              font-size="20" font-weight="bold" fill="#EE0033">119%</text>
    </g>
    <!-- Insight box -->
    <g id="insight">
        <rect x="80" y="620" width="1120" height="70" rx="8" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1"/>
        <text x="110" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="16" font-weight="600" fill="#000000">💡 Summary:</text>
        <text x="220" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="15" fill="#44494D">3 KPIs exceeded targets. Market share growth needs strengthening. Cost control requires attention.</text>
        <text x="110" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="14" font-weight="500" fill="#44494D">Recommendation: Prioritize cutting non-core project expenses while increasing marketing budget.</text>
    </g>
</svg>
