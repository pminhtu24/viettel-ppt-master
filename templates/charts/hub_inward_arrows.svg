<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Hub with Inward Arrows Template
    Structure: 1 center subject + 4-5 surrounding nodes with arrows pointing inward (forces pressuring the center)
    Use cases: Porter's Five Forces (central rivalry, threat of new entrants/substitutes, bargaining power of buyers/suppliers), threat-model with central asset, pressure-on-core diagrams
    Supports: Central + 4 peripheral layout (Classic Cross). Differs from hub_spoke by arrow direction (inward, not outward).
    -->
    <defs>
        <!-- Standard Card Shadow -->
        <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feFlood flood-color="#0F172A" flood-opacity="0.08" result="shadowColor"/>
            <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
            <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- Arrowhead Marker for Connecting Lines -->
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
        </marker>
    </defs>
    <!-- Background -->
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- Title Area -->
    <text x="640" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="32" font-weight="800" fill="#000000" text-anchor="middle">Porter's Five Forces Analysis</text>
    <text x="640" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="14" font-weight="700" fill="#44494D" letter-spacing="1.5" text-anchor="middle">ENTERPRISE SAAS MARKET · COMPETITIVE LANDSCAPE ASSESSMENT 2025</text>
    <!-- ==================== Connecting Arrows ==================== -->
    <g stroke="#999999" stroke-width="3">
        <!-- Top to Center -->
        <line x1="640" y1="230" x2="640" y2="305" marker-end="url(#arrow)"/>
        <!-- Bottom to Center -->
        <line x1="640" y1="530" x2="640" y2="455" marker-end="url(#arrow)"/>
        <!-- Left to Center -->
        <line x1="440" y1="380" x2="495" y2="380" marker-end="url(#arrow)"/>
        <!-- Right to Center -->
        <line x1="840" y1="380" x2="785" y2="380" marker-end="url(#arrow)"/>
    </g>
    <!-- ==================== The Five Forces ==================== -->
    <!-- 1. Center Card: Industry Rivalry (Very High) -->
    <g transform="translate(640, 380)">
        <rect x="-130" y="-60" width="260" height="120" rx="12" fill="#F2F2F2" stroke="#EE0033" stroke-width="2" filter="url(#cardShadow)" stroke-opacity="0.25"/>
        <!-- Top Accent -->
        <g>
            <rect x="-129" y="-59" width="258" height="12" rx="11" fill="#EE0033"/>
            <rect x="-129" y="-50" width="258" height="9" fill="#EE0033"/>
        </g>
        <!-- Title & Badge -->
        <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#EE0033" text-anchor="middle">Industry Rivalry</text>
        <rect x="-40" y="-12" width="80" height="24" rx="6" fill="#EE0033" fill-opacity="0.25"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#EE0033" text-anchor="middle">VERY HIGH</text>
        <!-- Bullets -->
        <circle cx="-100" cy="27" r="4" fill="#EE0033"/>
        <text x="-85" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#EE0033">Many fierce competitors</text>
        <circle cx="-100" cy="47" r="4" fill="#EE0033"/>
        <text x="-85" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#EE0033">Price wars are common</text>
    </g>
    <!-- 2. Top Card: Threat of New Entrants (Medium) -->
    <g transform="translate(640, 160)">
        <rect x="-130" y="-60" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <!-- Top Accent -->
        <g>
            <rect x="-129" y="-59" width="258" height="12" rx="11" fill="#F46A25"/>
            <rect x="-129" y="-50" width="258" height="9" fill="#F46A25"/>
        </g>
        <!-- Title & Badge -->
        <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle">Threat of New Entrants</text>
        <rect x="-35" y="-12" width="70" height="24" rx="6" fill="#F46A25" fill-opacity="0.25"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#F46A25" text-anchor="middle">MEDIUM</text>
        <!-- Bullets -->
        <circle cx="-100" cy="27" r="4" fill="#999999"/>
        <text x="-85" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">High capital barriers</text>
        <circle cx="-100" cy="47" r="4" fill="#999999"/>
        <text x="-85" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Tech accumulation needed</text>
    </g>
    <!-- 3. Bottom Card: Threat of Substitutes (Low) -->
    <g transform="translate(640, 600)" data-viettel-blue-scope="chart">
        <rect x="-130" y="-60" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <!-- Top Accent -->
        <g>
            <rect x="-129" y="-59" width="258" height="12" rx="11" fill="#10B981"/>
            <rect x="-129" y="-50" width="258" height="9" fill="#10B981"/>
        </g>
        <!-- Title & Badge -->
        <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle">Threat of Substitutes</text>
        <rect x="-30" y="-12" width="60" height="24" rx="6" fill="#10B981" fill-opacity="0.25"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#28A197" text-anchor="middle">LOW</text>
        <!-- Bullets -->
        <circle cx="-100" cy="27" r="4" fill="#999999"/>
        <text x="-85" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Few effective alternatives</text>
        <circle cx="-100" cy="47" r="4" fill="#999999"/>
        <text x="-85" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">High product differentiation</text>
    </g>
    <!-- 4. Left Card: Power of Suppliers (Medium-High) -->
    <g transform="translate(300, 380)">
        <rect x="-130" y="-60" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <!-- Top Accent -->
        <g>
            <rect x="-129" y="-59" width="258" height="12" rx="11" fill="#F46A25"/>
            <rect x="-129" y="-50" width="258" height="9" fill="#F46A25"/>
        </g>
        <!-- Title & Badge -->
        <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle">Power of Suppliers</text>
        <rect x="-40" y="-12" width="80" height="24" rx="6" fill="#F46A25" fill-opacity="0.12"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#F46A25" text-anchor="middle">MED-HIGH</text>
        <!-- Bullets -->
        <circle cx="-100" cy="27" r="4" fill="#999999"/>
        <text x="-85" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Cloud vendors concentrated</text>
        <circle cx="-100" cy="47" r="4" fill="#999999"/>
        <text x="-85" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">High dependency on infra</text>
    </g>
    <!-- 5. Right Card: Power of Buyers (High) -->
    <g transform="translate(980, 380)">
        <rect x="-130" y="-60" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
        <!-- Top Accent -->
        <g>
            <rect x="-129" y="-59" width="258" height="12" rx="11" fill="#EE0033"/>
            <rect x="-129" y="-50" width="258" height="9" fill="#EE0033"/>
        </g>
        <!-- Title & Badge -->
        <text x="0" y="-25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#000000" text-anchor="middle">Power of Buyers</text>
        <rect x="-30" y="-12" width="60" height="24" rx="6" fill="#F2F2F2"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#EE0033" text-anchor="middle">HIGH</text>
        <!-- Bullets -->
        <circle cx="-100" cy="27" r="4" fill="#999999"/>
        <text x="-85" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Many alternative choices</text>
        <circle cx="-100" cy="47" r="4" fill="#999999"/>
        <text x="-85" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Low switching costs</text>
    </g>
    <!-- ==================== Side Panels ==================== -->
    <!-- Top-Right: Overall Assessment -->
    <rect x="1040" y="100" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="1140" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#000000" text-anchor="middle">Overall Intensity</text>
    <text x="1140" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#EE0033" text-anchor="middle">3.4 <tspan font-size="20" font-weight="600" fill="#999999">/ 5</tspan></text>
    <text x="1140" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#EE0033" text-anchor="middle">High Competition</text>
    <!-- Top-Left: Strategic Implications -->
    <rect x="40" y="100" width="240" height="150" rx="10" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="160" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#000000" text-anchor="middle">Strategic Implications</text>
    <circle cx="65" cy="155" r="4" fill="#12436D" data-viettel-blue-scope="chart"/>
    <text x="80" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Build technical moats</text>
    <circle cx="65" cy="180" r="4" fill="#12436D" data-viettel-blue-scope="chart"/>
    <text x="80" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Improve customer stickiness</text>
    <circle cx="65" cy="205" r="4" fill="#12436D" data-viettel-blue-scope="chart"/>
    <text x="80" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Diversify supply chain</text>
    <circle cx="65" cy="230" r="4" fill="#12436D" data-viettel-blue-scope="chart"/>
    <text x="80" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#44494D">Focus on differentiation</text>
    <!-- Bottom-Left: Threat Legend -->
    <g transform="translate(40, 630)" data-viettel-blue-scope="chart">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#44494D">Threat Levels:</text>
        <rect x="100" y="-10" width="12" height="12" rx="3" fill="#10B981"/>
        <text x="120" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#44494D">Low</text>
        <rect x="160" y="-10" width="12" height="12" rx="3" fill="#F46A25"/>
        <text x="180" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#44494D">Medium</text>
        <rect x="245" y="-10" width="12" height="12" rx="3" fill="#F46A25"/>
        <text x="265" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#44494D">Med-High</text>
        <rect x="345" y="-10" width="12" height="12" rx="3" fill="#EE0033"/>
        <text x="365" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#44494D">High</text>
        <rect x="410" y="-10" width="12" height="12" rx="3" fill="#EE0033"/>
        <text x="430" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#44494D">Very High</text>
    </g>
    <!-- Data Source -->
    <text x="640" y="695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="12" font-weight="600" fill="#999999" text-anchor="middle">Data Source: Industry Research Department - 2025 Market Competition Analysis Report</text>
</svg>
