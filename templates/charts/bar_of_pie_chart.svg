<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Bar of Pie Chart Template
    Purpose: Expand small pie slices into a stacked bar
    Use cases: long-tail composition, category share decomposition, expense detail
    Feature: pie with its small slices expanded into a stacked bar detail
    -->

    <rect width="1280" height="720" fill="#FFFFFF"/>
    <g id="header">
        <text x="60" y="78"
              font-size="34" font-weight="800" fill="#000000"><tspan>Category Share with Bar Detail</tspan></text>
        <text x="60" y="112"
              font-size="14" font-weight="700" fill="#44494D" letter-spacing="1"><tspan>BAR OF PIE · STACKED DETAIL FOR SMALL SEGMENTS</tspan></text>
    </g>
    <g id="bar_of_pie_chart" data-viettel-blue-scope="chart">
        <g id="chartArea">
            <rect x="80" y="145" width="900" height="450" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
            <!-- chart-plot-area: bar-of-pie | pie-center: 360,370 | radius: 170 | bar: 720,240,900,500 -->
            <g id="mainPie">
                <circle cx="360" cy="370" r="170" fill="#F2F2F2"/>
                <path d="M 360,370 L 360,200 A 170,170 0 1,1 307.5,531.7 Z" fill="#12436D" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 360,370 L 307.5,531.7 A 170,170 0 0,1 198.3,317.5 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 360,370 L 198.3,317.5 A 170,170 0 0,1 360,200 Z" fill="#F46A25" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
                <text x="360" y="374" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>82%</tspan></text>
                <text x="360" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Primary slices</tspan></text>
            </g>
            <g id="connectorLines">
                <line x1="515" y1="300" x2="720" y2="240" stroke="#E6E6E6" stroke-width="2"/>
                <line x1="515" y1="440" x2="720" y2="500" stroke="#E6E6E6" stroke-width="2"/>
            </g>
            <g id="tailBar">
                <rect x="720" y="240" width="180" height="116" fill="#7C3AED"/>
                <rect x="720" y="356" width="180" height="87" fill="#7C3AED"/>
                <rect x="720" y="443" width="180" height="57" fill="#999999"/>
                <rect x="720" y="240" width="180" height="260" fill="none" stroke="#FFFFFF" stroke-width="4"/>
                <text x="810" y="306" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>Tail D · 8%</tspan></text>
                <text x="810" y="407" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>Tail E · 6%</tspan></text>
                <text x="810" y="478" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle"><tspan>Tail F · 4%</tspan></text>
                <text x="810" y="570" font-size="13" font-weight="700" fill="#44494D" text-anchor="middle"><tspan>Stacked tail detail</tspan></text>
            </g>
        </g>
    </g>
    <g id="splitPanel" transform="translate(1010, 170)">
        <rect x="0" y="0" width="220" height="360" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="24" y="38" font-size="16" font-weight="800" fill="#000000"><tspan>Split Logic</tspan></text>
        <line x1="24" y1="58" x2="196" y2="58" stroke="#E6E6E6"/>
        <text x="24" y="95" font-size="13" font-weight="700" fill="#44494D"><tspan>Main pie</tspan></text>
        <text x="24" y="124" font-size="28" font-weight="800" fill="#000000"><tspan>82%</tspan></text>
        <text x="24" y="165" font-size="13" font-weight="700" fill="#44494D"><tspan>Stacked detail</tspan></text>
        <text x="24" y="194" font-size="28" font-weight="800" fill="#000000"><tspan>18%</tspan></text>
        <rect x="24" y="235" width="172" height="78" rx="8" fill="#F2F2F2" stroke="#E6E6E6"/>
        <text x="42" y="263" font-size="13" font-weight="800" fill="#000000"><tspan>Best when</tspan></text>
        <text x="42" y="286" font-weight="600" fill="#44494D"><tspan>tail slices need</tspan></text>
        <text x="42" y="304" font-weight="600" fill="#44494D"><tspan>ranked comparison.</tspan></text>
    </g>
    <g id="source">
        <text x="60" y="695"
              font-size="14" font-weight="600" fill="#999999"><tspan>Data Source: Product Analytics</tspan></text>
    </g>
</svg>
