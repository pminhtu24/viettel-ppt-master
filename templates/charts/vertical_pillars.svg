<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Vertical Pillars Template
    Structure: 1×N vertical column layout (typically 1×3, 1×4, or 1×5) where each pillar = one independent category with title + bullets
    Use cases: PEST/PESTLE (Political/Economic/Social/Technological), four-pillar strategy overview, side-by-side independent categories without comparison axis
    Design Principles: Clean vertical pillars with distinctive accent colors and structured text hierarchy
    -->
    <defs>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="4"/>
            <feFlood flood-color="#0F172A" flood-opacity="0.04"/>
            <feComposite in2="SourceAlpha" operator="in"/>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- ==================== Header ==================== -->
    <text x="80" y="70" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#000000">PEST Macro-Environment Analysis</text>
    <text x="80" y="100" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#44494D" letter-spacing="1">EXTERNAL STRATEGIC FACTORS IMPACTING MARKET ENTRY</text>
    <!-- ==================== PEST Columns ==================== -->
    <g transform="translate(80, 150)" data-viettel-blue-scope="chart">
        <!-- 1. Political (P) -->
        <g transform="translate(0, 0)">
            <!-- Background Card -->
            <rect width="260" height="480" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
            <!-- Top-rounded Header Block (圆顶角分区头) -->
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#F2F2F2"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#000000" text-anchor="middle">P</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#000000" text-anchor="middle">POLITICAL</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#12436D" stroke-width="2" stroke-opacity="0.25"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="#12436D"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Trade Tariffs</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Pending cross-border trade</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">regulations affecting COGS.</text>
            <circle cx="30" cy="240" r="4" fill="#12436D"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Data Privacy Laws</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Strict GDPR compliance</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">required for EU expansion.</text>
            <circle cx="30" cy="320" r="4" fill="#12436D"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Government Subsidies</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">New grants available for</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">green tech initiatives.</text>
        </g>
        <!-- 2. Economic (E) -->
        <g transform="translate(286, 0)">
            <rect width="260" height="480" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#F2F2F2"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#28A197" text-anchor="middle">E</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#28A197" text-anchor="middle">ECONOMIC</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#10B981" stroke-width="2" stroke-opacity="0.25"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="#10B981"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Inflation Rates</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Rising inflation decreasing</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">consumer purchasing power.</text>
            <circle cx="30" cy="240" r="4" fill="#10B981"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Exchange Rates</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Currency volatility impacting</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">export profit margins.</text>
            <circle cx="30" cy="320" r="4" fill="#10B981"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Interest Rates</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Higher borrowing costs</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">for upcoming capital project.</text>
        </g>
        <!-- 3. Social (S) -->
        <g transform="translate(572, 0)">
            <rect width="260" height="480" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#F2F2F2"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#F46A25" text-anchor="middle">S</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F46A25" text-anchor="middle">SOCIAL</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#F46A25" stroke-width="2" stroke-opacity="0.45"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="#F46A25"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Demographic Shifts</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Aging population creates</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">demand for healthcare tech.</text>
            <circle cx="30" cy="240" r="4" fill="#F46A25"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Workplace Trends</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Permanent shift towards</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">hybrid and remote work.</text>
            <circle cx="30" cy="320" r="4" fill="#F46A25"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Consumer Attitudes</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Increasing preference for</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">sustainable products.</text>
        </g>
        <!-- 4. Technological (T) -->
        <g transform="translate(858, 0)">
            <rect width="260" height="480" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5" filter="url(#cardShadow)"/>
            <path d="M 12 0 h 236 a 12 12 0 0 1 12 12 v 108 h -260 v -108 a 12 12 0 0 1 12 -12 Z" fill="#F2F2F2"/>
            <text x="130" y="55" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#000000" text-anchor="middle">T</text>
            <text x="130" y="90" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#000000" text-anchor="middle">TECHNOLOGICAL</text>
            <line x1="20" y1="120" x2="240" y2="120" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.25"/>
            <!-- Bullet Points -->
            <circle cx="30" cy="160" r="4" fill="#7C3AED"/>
            <text x="45" y="165" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">AI Automation</text>
            <text x="45" y="185" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Generative AI threatening</text>
            <text x="45" y="205" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">legacy software models.</text>
            <circle cx="30" cy="240" r="4" fill="#7C3AED"/>
            <text x="45" y="245" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Infrastructure</text>
            <text x="45" y="265" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">5G rollout enables new</text>
            <text x="45" y="285" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">IoT product capabilities.</text>
            <circle cx="30" cy="320" r="4" fill="#7C3AED"/>
            <text x="45" y="325" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#000000">Cybersecurity Risk</text>
            <text x="45" y="345" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">Escalating threat landscape</text>
            <text x="45" y="365" font-family="Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#44494D">requires higher R&amp;D spend.</text>
        </g>
    </g>
</svg>
