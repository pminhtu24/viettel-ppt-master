<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!--
    Funnel Chart Template
    Usage: Conversion flow analysis
    Scenarios: Sales funnel, user conversion, process efficiency
    Supports: 4 stages (3-5 recommended)
    -->
    <defs>
        <!-- Arrow -->
        <marker id="arrowLoss" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,6 L9,3 z" fill="#EE0033" />
        </marker>
    </defs>
    <!-- Background -->
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- Title -->
    <g id="header">
        <text x="60" y="80"
              font-size="32" font-weight="700" fill="#000000">Conversion Funnel Analysis</text>
        <text x="60" y="115"
              font-size="18" fill="#44494D">Quarterly Performance · Total Volume: 10,000</text>
    </g>
    <!-- Funnel Chart -->
    <g id="funnel_chart" data-viettel-blue-scope="chart">
    <g id="funnelChart">
        <!-- Stage 1: Awareness (y: 160-240) -->
        <path d="M 340,160 L 940,160 L 895,240 L 385,240 Z"
              fill="#12436D"/>
        <text x="640" y="205"
              font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 01: Awareness: 10,000</text>
        <text x="640" y="228"
              font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.9">100%</text>
        <!-- Stage 2: Interest (y: 270-350) -->
        <path d="M 385,270 L 895,270 L 850,350 L 430,350 Z"
              fill="#12436D"/>
        <text x="640" y="315"
              font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 02: Interest: 4,500</text>
        <text x="640" y="338"
              font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.9">45%</text>
        <!-- Stage 3: Consideration (y: 380-460) -->
        <path d="M 430,380 L 850,380 L 805,460 L 475,460 Z"
              fill="#059669"/>
        <text x="640" y="425"
              font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 03: Consideration: 1,800</text>
        <text x="640" y="448"
              font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.9">18%</text>
        <!-- Stage 4: Conversion (y: 490-570) -->
        <path d="M 475,490 L 805,490 L 760,570 L 520,570 Z"
              fill="#F46A25"/>
        <text x="640" y="535"
              font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 04: Conversion: 650</text>
        <text x="640" y="558"
              font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.9">6.5%</text>
    </g>
    </g>
    <!-- Right Annotations (Drop-off) -->
    <g id="lossAnnotations">
        <!-- Loss 1: 10,000 -> 4,500 -->
        <line x1="950" y1="250" x2="1020" y2="250" stroke="#EE0033" stroke-width="2" marker-end="url(#arrowLoss)"/>
        <text x="1030" y="245"
              font-size="18" font-weight="600" fill="#EE0033">Drop-off: 5,500</text>
        <text x="1030" y="265"
              font-size="15" fill="#44494D">Conversion: 45%</text>
        <!-- Loss 2: 4,500 -> 1,800 -->
        <line x1="905" y1="360" x2="975" y2="360" stroke="#EE0033" stroke-width="2" marker-end="url(#arrowLoss)"/>
        <text x="985" y="355"
              font-size="18" font-weight="600" fill="#EE0033">Drop-off: 2,700</text>
        <text x="985" y="375"
              font-size="15" fill="#44494D">Conversion: 40%</text>
        <!-- Loss 3: 1,800 -> 650 -->
        <line x1="860" y1="470" x2="930" y2="470" stroke="#EE0033" stroke-width="2" marker-end="url(#arrowLoss)"/>
        <text x="940" y="465"
              font-size="18" font-weight="600" fill="#EE0033">Drop-off: 1,150</text>
        <text x="940" y="485"
              font-size="15" fill="#44494D">Conversion: 36%</text>
    </g>
    <!-- Left Key Metrics -->
    <g id="keyMetrics" data-viettel-blue-scope="chart">
        <rect x="60" y="180" width="220" height="380" rx="8" fill="#FFFFFF" stroke="#E6E6E6"/>
        <text x="170" y="215"
              font-size="18" font-weight="700" fill="#000000" text-anchor="middle">Key Metrics</text>
        <!-- Metric 1 -->
        <rect x="80" y="245" width="4" height="50" rx="2" fill="#F46A25"/>
        <text x="95" y="260"
              font-size="14" fill="#44494D">Total Conversion</text>
        <text x="95" y="285"
              font-size="32" font-weight="700" fill="#F46A25">6.5%</text>
        <!-- Metric 2 -->
        <rect x="80" y="320" width="4" height="50" rx="2" fill="#12436D"/>
        <text x="95" y="335"
              font-size="14" fill="#44494D">Avg. Deal Size</text>
        <text x="95" y="360"
              font-size="28" font-weight="700" fill="#000000">$125K</text>
        <!-- Metric 3 -->
        <rect x="80" y="395" width="4" height="50" rx="2" fill="#10B981"/>
        <text x="95" y="410"
              font-size="14" fill="#44494D">Total Revenue</text>
        <text x="95" y="435"
              font-size="28" font-weight="700" fill="#28A197">$81.3M</text>
        <!-- Metric 4 -->
        <rect x="80" y="470" width="4" height="50" rx="2" fill="#7C3AED"/>
        <text x="95" y="485"
              font-size="14" fill="#44494D">Sales Cycle</text>
        <text x="95" y="510"
              font-size="28" font-weight="700" fill="#000000">42 Days</text>
    </g>
    <!-- Bottom Insight -->
    <g id="insight">
        <rect x="320" y="610" width="880" height="60" rx="6" fill="#F46A25" stroke="#F46A25" stroke-width="2" fill-opacity="0.25"/>
        <text x="340" y="635"
              font-size="16" font-weight="700" fill="#000000">💡 Key Insight: </text>
        <text x="460" y="635"
              font-size="15" fill="#44494D">Significant drop-off between Interest and Consideration stages (40% conversion).</text>
        <text x="340" y="655"
              font-size="15" fill="#44494D">Recommend optimizing follow-up cadence and improving proposal quality to boost retention.</text>
    </g>
    <!-- Footer -->
    <g id="source">
        <text x="60" y="695"
              font-size="14" fill="#999999">Source: Internal CRM Performance Data</text>
    </g>
</svg>
