<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="12">
    <!-- 
    Radar Chart with Data Dashboard Template
    Purpose: Multi-dimensional capability assessment, competitor benchmarking
    Use cases: Product evaluation, performance reviews, feature comparisons
    Supports: 6 dimensions, 2 comparison entities, integrated data table
    -->
    <defs data-viettel-blue-scope="chart">
        <!-- Product A Gradient (Indigo) -->
        <linearGradient id="gradProdA" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#12436D" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#12436D" stop-opacity="0.25" />
        </linearGradient>
        <!-- Product B Gradient (Rose) -->
        <linearGradient id="gradProdB" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EE0033" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#EE0033" stop-opacity="0.25" />
        </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="1280" height="720" fill="#F2F2F2"/>
    <!-- ==================== Header ==================== -->
    <g id="header">
        <text x="60" y="70" font-size="32" font-weight="800" fill="#000000">Comprehensive Capability Assessment</text>
        <text x="60" y="100" font-size="14" font-weight="700" fill="#44494D" letter-spacing="1">PRODUCT A VS PRODUCT B · SIX-DIMENSIONAL ANALYSIS</text>
    </g>
    <g id="radar_chart" data-viettel-blue-scope="chart">
    <!-- chart-plot-area: radar | center: 500,380 | radius: 220 -->
    <!-- ==================== Radar Chart ==================== -->
    <g id="radarChart" transform="translate(500, 380)">
        <!-- Concentric Background Grids (Zebra filled for contrast) -->
        <polygon points="0,-220 190.5,-110 190.5,110 0,220 -190.5,110 -190.5,-110" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <polygon points="0,-176 152.4,-88 152.4,88 0,176 -152.4,88 -152.4,-88" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1.5"/>
        <polygon points="0,-132 114.3,-66 114.3,66 0,132 -114.3,66 -114.3,-66" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <polygon points="0,-88 76.2,-44 76.2,44 0,88 -76.2,44 -76.2,-44" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1.5"/>
        <polygon points="0,-44 38.1,-22 38.1,22 0,44 -38.1,22 -38.1,-22" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <!-- Axis Lines -->
        <line x1="0" y1="0" x2="0" y2="-220" stroke="#E6E6E6" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="190.5" y2="-110" stroke="#E6E6E6" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="190.5" y2="110" stroke="#E6E6E6" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="0" y2="220" stroke="#E6E6E6" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="-190.5" y2="110" stroke="#E6E6E6" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="-190.5" y2="-110" stroke="#E6E6E6" stroke-width="1.5"/>
        <!-- Axis Scale Markers -->
        <text x="6" y="-40" font-weight="700" fill="#999999">20</text>
        <text x="6" y="-84" font-weight="700" fill="#999999">40</text>
        <text x="6" y="-128" font-weight="700" fill="#999999">60</text>
        <text x="6" y="-172" font-weight="700" fill="#999999">80</text>
        <text x="6" y="-216" font-weight="700" fill="#999999">100</text>
        <!-- Product B Area (Drawn first to sit behind Product A) -->
        <polygon points="0,-165 171.5,-99 161.9,93.5 0,176 -133.4,77 -123.8,-71.5" fill="url(#gradProdB)" stroke="#EE0033" stroke-width="3"/>
        <circle cx="0" cy="-165" r="5" fill="#FFFFFF" stroke="#EE0033" stroke-width="2.5"/>
        <circle cx="171.5" cy="-99" r="5" fill="#FFFFFF" stroke="#EE0033" stroke-width="2.5"/>
        <circle cx="161.9" cy="93.5" r="5" fill="#FFFFFF" stroke="#EE0033" stroke-width="2.5"/>
        <circle cx="0" cy="176" r="5" fill="#FFFFFF" stroke="#EE0033" stroke-width="2.5"/>
        <circle cx="-133.4" cy="77" r="5" fill="#FFFFFF" stroke="#EE0033" stroke-width="2.5"/>
        <circle cx="-123.8" cy="-71.5" r="5" fill="#FFFFFF" stroke="#EE0033" stroke-width="2.5"/>
        <!-- Product A Area -->
        <polygon points="0,-198 162,-93.5 143,82.5 0,154 -152.4,88 -167.7,-96.8" fill="url(#gradProdA)" stroke="#12436D" stroke-width="3"/>
        <circle cx="0" cy="-198" r="5" fill="#FFFFFF" stroke="#12436D" stroke-width="2.5"/>
        <circle cx="162" cy="-93.5" r="5" fill="#FFFFFF" stroke="#12436D" stroke-width="2.5"/>
        <circle cx="143" cy="82.5" r="5" fill="#FFFFFF" stroke="#12436D" stroke-width="2.5"/>
        <circle cx="0" cy="154" r="5" fill="#FFFFFF" stroke="#12436D" stroke-width="2.5"/>
        <circle cx="-152.4" cy="88" r="5" fill="#FFFFFF" stroke="#12436D" stroke-width="2.5"/>
        <circle cx="-167.7" cy="-96.8" r="5" fill="#FFFFFF" stroke="#12436D" stroke-width="2.5"/>
        <!-- Dimension Labels -->
        <text x="0" y="-240" font-size="16" font-weight="800" fill="#000000" text-anchor="middle">Performance</text>
        <text x="210" y="-115" font-size="16" font-weight="800" fill="#000000" text-anchor="start">Security</text>
        <text x="210" y="125" font-size="16" font-weight="800" fill="#000000" text-anchor="start">Usability</text>
        <text x="0" y="255" font-size="16" font-weight="800" fill="#000000" text-anchor="middle">Pricing</text>
        <text x="-210" y="125" font-size="16" font-weight="800" fill="#000000" text-anchor="end">Support</text>
        <text x="-210" y="-115" font-size="16" font-weight="800" fill="#000000" text-anchor="end">Innovation</text>
    </g>
    </g>
    <!-- ==================== Data Dashboard Table ==================== -->
    <g id="dataDashboard" data-viettel-blue-scope="chart">
        <rect x="850" y="150" width="380" height="390" rx="12" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1.5"/>
        <!-- Table Title -->
        <text x="880" y="195" font-size="18" font-weight="800" fill="#000000">Competitor Benchmark</text>
        <!-- Table Headers & Legend -->
        <line x1="850" y1="210" x2="1230" y2="210" stroke="#E6E6E6" stroke-width="1.5"/>
        <text x="880" y="235" font-weight="800" fill="#44494D" letter-spacing="1">METRIC</text>
        <rect x="980" y="225" width="12" height="12" rx="3" fill="#12436D"/>
        <text x="998" y="235" font-size="13" font-weight="800" fill="#000000">PROD A</text>
        <rect x="1065" y="225" width="12" height="12" rx="3" fill="#EE0033"/>
        <text x="1083" y="235" font-size="13" font-weight="800" fill="#000000">PROD B</text>
        <text x="1160" y="235" font-weight="800" fill="#44494D" letter-spacing="1">LEAD</text>
        <line x1="850" y1="250" x2="1230" y2="250" stroke="#E6E6E6" stroke-width="1"/>
        <!-- Row 1: Performance -->
        <text x="880" y="285" font-size="14" font-weight="700" fill="#000000">Performance</text>
        <text x="998" y="285" font-size="14" font-weight="800" fill="#000000">90%</text>
        <text x="1083" y="285" font-size="14" font-weight="600" fill="#44494D">75%</text>
        <rect x="1155" y="268" width="36" height="24" rx="12" fill="#F2F2F2"/>
        <text x="1173" y="285" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">A</text>
        <line x1="880" y1="300" x2="1200" y2="300" stroke="#F2F2F2" stroke-width="1"/>
        <!-- Row 2: Security -->
        <text x="880" y="330" font-size="14" font-weight="700" fill="#000000">Security</text>
        <text x="998" y="330" font-size="14" font-weight="600" fill="#44494D">85%</text>
        <text x="1083" y="330" font-size="14" font-weight="800" fill="#EE0033">90%</text>
        <rect x="1155" y="313" width="36" height="24" rx="12" fill="#F2F2F2"/>
        <text x="1173" y="330" font-size="13" font-weight="800" fill="#EE0033" text-anchor="middle">B</text>
        <line x1="880" y1="345" x2="1200" y2="345" stroke="#F2F2F2" stroke-width="1"/>
        <!-- Row 3: Usability -->
        <text x="880" y="375" font-size="14" font-weight="700" fill="#000000">Usability</text>
        <text x="998" y="375" font-size="14" font-weight="600" fill="#44494D">75%</text>
        <text x="1083" y="375" font-size="14" font-weight="800" fill="#EE0033">85%</text>
        <rect x="1155" y="358" width="36" height="24" rx="12" fill="#F2F2F2"/>
        <text x="1173" y="375" font-size="13" font-weight="800" fill="#EE0033" text-anchor="middle">B</text>
        <line x1="880" y1="390" x2="1200" y2="390" stroke="#F2F2F2" stroke-width="1"/>
        <!-- Row 4: Pricing -->
        <text x="880" y="420" font-size="14" font-weight="700" fill="#000000">Pricing</text>
        <text x="998" y="420" font-size="14" font-weight="600" fill="#44494D">70%</text>
        <text x="1083" y="420" font-size="14" font-weight="800" fill="#EE0033">80%</text>
        <rect x="1155" y="403" width="36" height="24" rx="12" fill="#F2F2F2"/>
        <text x="1173" y="420" font-size="13" font-weight="800" fill="#EE0033" text-anchor="middle">B</text>
        <line x1="880" y1="435" x2="1200" y2="435" stroke="#F2F2F2" stroke-width="1"/>
        <!-- Row 5: Support -->
        <text x="880" y="465" font-size="14" font-weight="700" fill="#000000">Support</text>
        <text x="998" y="465" font-size="14" font-weight="800" fill="#000000">80%</text>
        <text x="1083" y="465" font-size="14" font-weight="600" fill="#44494D">70%</text>
        <rect x="1155" y="448" width="36" height="24" rx="12" fill="#F2F2F2"/>
        <text x="1173" y="465" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">A</text>
        <line x1="880" y1="480" x2="1200" y2="480" stroke="#F2F2F2" stroke-width="1"/>
        <!-- Row 6: Innovation -->
        <text x="880" y="510" font-size="14" font-weight="700" fill="#000000">Innovation</text>
        <text x="998" y="510" font-size="14" font-weight="800" fill="#000000">88%</text>
        <text x="1083" y="510" font-size="14" font-weight="600" fill="#44494D">65%</text>
        <rect x="1155" y="493" width="36" height="24" rx="12" fill="#F2F2F2"/>
        <text x="1173" y="510" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">A</text>
    </g>
    <!-- ==================== Footer ==================== -->
    <g id="source">
        <text x="60" y="685" font-size="13" font-weight="600" fill="#999999">Data Source: Product Evaluation Report 2025</text>
    </g>
</svg>
