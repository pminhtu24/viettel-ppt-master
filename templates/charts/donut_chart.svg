<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Donut Chart Template
    Use only for: 2-slice KPI or MECE 3-6-slice composition
    Composition center: absolute total or 100%; KPI center: primary slice value
    Convention: start at 12 o'clock and proceed clockwise
    -->
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <text x="60" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="34" font-weight="bold" fill="#000000">Product Line Revenue Share</text>
    <text x="60" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#44494D">Q3 2025 · Total Revenue $520M</text>

    <!-- chart-plot-area: donut | center: 400,410 | outer-radius: 180 | inner-radius: 100 -->
    <g id="donutChart" transform="translate(400,410)" data-viettel-blue-scope="chart">
        <!-- Data: 30,22,18,12,10,8 = 100%; start=-90°, clockwise -->
        <g id="donut-sectors">
            <g id="sector-1">
                <path d="M 0.00,-100.00 L 0.00,-180.00 A 180.0,180.0 0 0,1 171.19,55.62 L 95.11,30.90 A 100.0,100.0 0 0,0 0.00,-100.00 Z"
                      fill="#EE0033"/>
            </g>
            <g id="sector-2">
                <path d="M 95.11,30.90 L 171.19,55.62 A 180.0,180.0 0 0,1 -22.56,178.58 L -12.53,99.21 A 100.0,100.0 0 0,0 95.11,30.90 Z"
                      fill="#12436D"/>
            </g>
            <g id="sector-3">
                <path d="M -12.53,99.21 L -22.56,178.58 A 180.0,180.0 0 0,1 -171.19,55.62 L -95.11,30.90 A 100.0,100.0 0 0,0 -12.53,99.21 Z"
                      fill="#28A197"/>
            </g>
            <g id="sector-4">
                <path d="M -95.11,30.90 L -171.19,55.62 A 180.0,180.0 0 0,1 -162.87,-76.64 L -90.48,-42.58 A 100.0,100.0 0 0,0 -95.11,30.90 Z"
                      fill="#F46A25"/>
            </g>
            <g id="sector-5">
                <path d="M -90.48,-42.58 L -162.87,-76.64 A 180.0,180.0 0 0,1 -86.72,-157.74 L -48.18,-87.63 A 100.0,100.0 0 0,0 -90.48,-42.58 Z"
                      fill="#7C3AED"/>
            </g>
            <g id="sector-6">
                <path d="M -48.18,-87.63 L -86.72,-157.74 A 180.0,180.0 0 0,1 -0.00,-180.00 L -0.00,-100.00 A 100.0,100.0 0 0,0 -48.18,-87.63 Z"
                      fill="#6B7280"/>
            </g>
        </g>
        <circle cx="0" cy="0" r="100" fill="#FFFFFF"/>
        <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="46" font-weight="bold" fill="#000000" text-anchor="middle">$520M</text>
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#44494D" text-anchor="middle">Total Revenue</text>
    </g>

    <!-- Every slice has a direct percentage label; leader and text match the slice. -->
    <g id="labels">
        <g id="label-1">
            <line x1="502" y1="336" x2="565" y2="300" stroke="#EE0033" stroke-width="1.5"/>
            <circle cx="502" cy="336" r="3" fill="#EE0033"/>
            <text x="575" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                  font-size="20" font-weight="600" fill="#EE0033">30%</text>
        </g>
        <g id="label-2" data-viettel-blue-scope="chart">
            <line x1="468" y1="516" x2="560" y2="545" stroke="#12436D" stroke-width="1.5"/>
            <circle cx="468" cy="516" r="3" fill="#12436D"/>
            <text x="570" y="552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                  font-size="20" font-weight="600" fill="#12436D">22%</text>
        </g>
        <g id="label-3">
            <line x1="320" y1="507" x2="235" y2="550" stroke="#28A197" stroke-width="1.5"/>
            <circle cx="320" cy="507" r="3" fill="#28A197"/>
            <text x="225" y="557" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                  font-size="20" font-weight="600" fill="#28A197" text-anchor="end">18%</text>
        </g>
        <g id="label-4">
            <line x1="274" y1="402" x2="185" y2="410" stroke="#F46A25" stroke-width="1.5"/>
            <circle cx="274" cy="402" r="3" fill="#F46A25"/>
            <text x="175" y="417" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                  font-size="20" font-weight="600" fill="#F46A25" text-anchor="end">12%</text>
        </g>
        <g id="label-5">
            <line x1="308" y1="324" x2="220" y2="285" stroke="#7C3AED" stroke-width="1.5"/>
            <circle cx="308" cy="324" r="3" fill="#7C3AED"/>
            <text x="210" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                  font-size="20" font-weight="600" fill="#7C3AED" text-anchor="end">10%</text>
        </g>
        <g id="label-6">
            <line x1="369" y1="288" x2="350" y2="235" stroke="#6B7280" stroke-width="1.5"/>
            <circle cx="369" cy="288" r="3" fill="#6B7280"/>
            <text x="340" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                  font-size="20" font-weight="600" fill="#6B7280" text-anchor="end">8%</text>
        </g>
    </g>

    <g id="detailList">
        <rect x="730" y="240" width="475" height="380" rx="12" fill="#F5F5F5" stroke="#E5E7EB" stroke-width="1"/>
        <text x="750" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="22" font-weight="600" fill="#000000">Detailed Data</text>
        <line x1="750" y1="288" x2="1185" y2="288" stroke="#E5E7EB" stroke-width="1"/>
        <g id="list-items">
            <g id="item-1">
                <rect x="750" y="300" width="8" height="28" rx="4" fill="#EE0033"/>
                <text x="775" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#44494D">Enterprise Services</text>
                <text x="1095" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="end">$156M</text>
                <text x="1180" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#EE0033" text-anchor="end">30%</text>
            </g>
            <g id="item-2" data-viettel-blue-scope="chart">
                <rect x="750" y="345" width="8" height="28" rx="4" fill="#12436D"/>
                <text x="775" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#44494D">Consumer Electronics</text>
                <text x="1095" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="end">$114.4M</text>
                <text x="1180" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#12436D" text-anchor="end">22%</text>
            </g>
            <g id="item-3">
                <rect x="750" y="390" width="8" height="28" rx="4" fill="#28A197"/>
                <text x="775" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#44494D">Cloud Computing</text>
                <text x="1095" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="end">$93.6M</text>
                <text x="1180" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#28A197" text-anchor="end">18%</text>
            </g>
            <g id="item-4">
                <rect x="750" y="435" width="8" height="28" rx="4" fill="#F46A25"/>
                <text x="775" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#44494D">IoT</text>
                <text x="1095" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="end">$62.4M</text>
                <text x="1180" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#F46A25" text-anchor="end">12%</text>
            </g>
            <g id="item-5">
                <rect x="750" y="480" width="8" height="28" rx="4" fill="#7C3AED"/>
                <text x="775" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#44494D">Partner Solutions</text>
                <text x="1095" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="end">$52M</text>
                <text x="1180" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#7C3AED" text-anchor="end">10%</text>
            </g>
            <g id="item-6">
                <rect x="750" y="525" width="8" height="28" rx="4" fill="#6B7280"/>
                <text x="775" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#44494D">Other</text>
                <text x="1095" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#000000" text-anchor="end">$41.6M</text>
                <text x="1180" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#6B7280" text-anchor="end">8%</text>
            </g>
        </g>
        <line x1="750" y1="570" x2="1185" y2="570" stroke="#D1D5DB" stroke-width="1.5"/>
        <text x="775" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="600" fill="#000000">Total</text>
        <text x="1095" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="20" font-weight="bold" fill="#000000" text-anchor="end">$520M</text>
        <text x="1180" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="600" fill="#000000" text-anchor="end">100%</text>
    </g>

    <text x="60" y="695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#999999">Data Source: Finance Department Quarterly Report</text>
</svg>
