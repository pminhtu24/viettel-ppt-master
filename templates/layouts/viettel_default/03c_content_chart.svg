<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="5" fill="#EE0033"/>
  <image href="../images/viettel-logo.png" x="1088" y="28" width="128" height="42" preserveAspectRatio="xMidYMid meet"/>

  <rect x="64" y="34" width="7" height="46" rx="3.5" fill="#EE0033"/>
  <text x="88" y="70" data-box="88,30,960,72" data-wrap="true" font-family="&quot;FS Magistral&quot;" font-size="38" font-weight="700" fill="#000000">{{PAGE_TITLE}}</text>
  <line x1="64" y1="116" x2="1216" y2="116" stroke="#E6E6E6" stroke-width="1"/>

  <!-- Chart Area (Large, Left) -->
  <rect x="72" y="146" width="760" height="472" rx="6" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1" stroke-dasharray="6 6"/>
  <text x="452" y="394" text-anchor="middle" font-family="&quot;FS Magistral&quot;" font-size="26" fill="#999999">{{CHART_AREA}}</text>

  <!-- Insights Panel (Right) -->
  <rect x="872" y="146" width="336" height="472" rx="6" fill="#F2F2F2" stroke="#E6E6E6" stroke-width="1"/>
  <text x="1040" y="184" text-anchor="middle" font-family="&quot;FS Magistral&quot;" font-size="26" font-weight="700" fill="#EE0033">KEY INSIGHTS</text>
  <line x1="892" y1="202" x2="1188" y2="202" stroke="#E6E6E6" stroke-width="1"/>

  <!-- Insight Items -->
  <g id="insight-1" transform="translate(892, 222)">
    <circle cx="10" cy="10" r="8" fill="#EE0033"/>
    <text x="28" y="18" font-family="&quot;FS Magistral&quot;" font-size="17" fill="#000000">{{INSIGHT_1}}</text>
  </g>
  <g id="insight-2" data-viettel-blue-scope="icon" transform="translate(892, 292)">
    <circle cx="10" cy="10" r="8" fill="#12436D"/>
    <text x="28" y="18" font-family="&quot;FS Magistral&quot;" font-size="17" fill="#000000">{{INSIGHT_2}}</text>
  </g>
  <g id="insight-3" transform="translate(892, 362)">
    <circle cx="10" cy="10" r="8" fill="#28A197"/>
    <text x="28" y="18" font-family="&quot;FS Magistral&quot;" font-size="17" fill="#000000">{{INSIGHT_3}}</text>
  </g>
  <g id="insight-4" transform="translate(892, 432)">
    <circle cx="10" cy="10" r="8" fill="#F46A25"/>
    <text x="28" y="18" font-family="&quot;FS Magistral&quot;" font-size="17" fill="#000000">{{INSIGHT_4}}</text>
  </g>

  <rect x="0" y="674" width="1280" height="46" fill="#F2F2F2"/>
  <rect x="0" y="674" width="8" height="46" fill="#EE0033"/>
  <text x="64" y="703" font-family="&quot;FS Magistral&quot;" font-size="17" font-weight="500" fill="#44494D">{{SECTION_NAME}}</text>
  <text x="640" y="703" text-anchor="middle" font-family="&quot;FS Magistral&quot;" font-size="17" fill="#44494D">{{SOURCE}}</text>
  <rect x="1174" y="684" width="42" height="26" rx="4" fill="#EE0033"/>
  <text x="1195" y="703" text-anchor="middle" font-family="&quot;FS Magistral&quot;" font-size="17" font-weight="700" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
